blueprint:
  name: FLARE
  description: >
    FLARE: phase-based circadian lighting - sets brightness/colour
    temperature from a FLARE schedule sensor,
    keeping lights updated as it changes, and turns them off a while
    after occupancy clears. Full details on every input:
    [the blueprint reference](https://danrspencer.github.io/flare/blueprint/).


    Blueprint version 0.16.0 - the integration raises a repair when a
    newer one is available.
  domain: automation
  source_url: https://github.com/danrspencer/flare/blob/main/blueprints/automation/danspencer/flare.yaml
  author: Dan Spencer
  homeassistant:
    # Required by the occupancy.* triggers/conditions.
    min_version: 2026.4.0
  input:
    adaptive_sensor:
      name: FLARE Sensor
      description: >
        Sensor providing brightness and colour temperature to apply -
        filtered to FLARE's own schedule sensors.
      selector:
        entity:
          filter:
            - integration: flare
              domain: sensor
    room_target:
      name: Lights & Occupancy
      description: >
        Entity, device, area, floor, or label - lights within it are
        controlled, occupancy-class sensors within it decide when.
        [Details](https://danrspencer.github.io/flare/blueprint/#setting-up-a-room).
      default: {}
      selector:
        target:
          entity:
            - domain: light
            - domain: binary_sensor
              device_class: occupancy
    extra_triggers:
      name: Additional Triggers (Optional)
      description: >
        Entities that trigger an immediate re-evaluation, e.g. a
        dependency of Scene Template or Brightness Template.
        Only updates lights that are already on - never switches one on.
        [Details](https://danrspencer.github.io/flare/blueprint/#additional-triggers).
      default: []
      selector:
        entity:
          multiple: true
    colour:
      name: Colour
      icon: mdi:palette
      collapsed: true
      input:
        rgb_phases:
          name: Prefer RGB During
          description: >
            Phases to send RGB colour instead of colour temperature, for
            lights that support it (auto-detected). At the high colour
            temperatures used during Morning/Day, this can look
            blue-tinted rather than a clean white, so those phases are
            off by default - Evening/Night's warmer values don't have
            that problem.
            [Details](https://danrspencer.github.io/flare/blueprint/#colour).
          default: [Evening, Night]
          selector:
            select:
              options: [Morning, Day, Evening, Night]
              multiple: true
    scene_handoff:
      name: Scene Handoff
      icon: mdi:palette-swatch
      collapsed: true
      input:
        scene_template:
          name: Scene Template (Optional)
          description: >
            Template returning a scene entity_id to hand the room over
            to instead of the adaptive brightness/colour. Takes
            precedence over the per-phase scenes below whenever it
            returns one - they're the fallback for phases it doesn't
            cover.
            [Details](https://danrspencer.github.io/flare/blueprint/#handing-a-room-to-a-scene).
          default: ""
          selector:
            template: {}
        morning_scene:
          name: Morning Scene (Optional)
          default: null
          selector:
            entity:
              domain: scene
        day_scene:
          name: Day Scene (Optional)
          default: null
          selector:
            entity:
              domain: scene
        evening_scene:
          name: Evening Scene (Optional)
          default: null
          selector:
            entity:
              domain: scene
        night_scene:
          name: Night Scene (Optional)
          default: null
          selector:
            entity:
              domain: scene
    brightness_exclusions:
      name: Brightness & Exclusions
      icon: mdi:brightness-percent
      collapsed: true
      input:
        brightness_template:
          name: Brightness Template (Optional)
          description: >
            Template returning entity_id → brightness, 0-255, replacing
            the curve's brightness for the lights it names (0 = off, null
            = skip entirely). The same scale the phase brightnesses use.
            Its own per-entity values always win over the per-phase
            exclusions below - those only fill in entities it doesn't
            already mention.
            [Details](https://danrspencer.github.io/flare/blueprint/#turning-lights-off-during-a-phase).
          default: "{{ {} }}"
          selector:
            template: {}
        morning_exclude_lights:
          name: Lights Off During Morning (Optional)
          selector:
            entity:
              domain: light
              multiple: true
          default: []
        day_exclude_lights:
          name: Lights Off During Day (Optional)
          selector:
            entity:
              domain: light
              multiple: true
          default: []
        evening_exclude_lights:
          name: Lights Off During Evening (Optional)
          selector:
            entity:
              domain: light
              multiple: true
          default: []
        night_exclude_lights:
          name: Lights Off During Night (Optional)
          selector:
            entity:
              domain: light
              multiple: true
          default: []
    idle_brightness:
      name: Idle Brightness
      icon: mdi:lightbulb-night
      collapsed: true
      input:
        idle_brightness_template:
          name: Idle Brightness Template (Optional)
          description: >
            Template returning entity_id → brightness, 1-255, for
            lights that should stay dimly lit when the room is empty,
            instead of switching off. Its own per-entity values always
            win over the per-phase settings below - those only fill in
            entities it doesn't already mention.
            [Details](https://danrspencer.github.io/flare/blueprint/#leaving-a-room-dimly-lit).
          default: "{{ {} }}"
          selector:
            template: {}
        morning_idle_brightness:
          name: Morning Idle Brightness (Optional)
          description: >
            What this phase dims to when the room is empty, instead of
            switching off, on the same 0-255 scale as the phase
            brightnesses. 0 means it goes dark, which is the default.
          default: 0
          selector:
            number:
              min: 0
              max: 255
              mode: box
        day_idle_brightness:
          name: Day Idle Brightness (Optional)
          description: >
            What this phase dims to when the room is empty, instead of
            switching off, on the same 0-255 scale as the phase
            brightnesses. 0 means it goes dark, which is the default.
          default: 0
          selector:
            number:
              min: 0
              max: 255
              mode: box
        evening_idle_brightness:
          name: Evening Idle Brightness (Optional)
          description: >
            What this phase dims to when the room is empty, instead of
            switching off, on the same 0-255 scale as the phase
            brightnesses. 0 means it goes dark, which is the default.
          default: 0
          selector:
            number:
              min: 0
              max: 255
              mode: box
        night_idle_brightness:
          name: Night Idle Brightness (Optional)
          description: >
            What this phase dims to when the room is empty, instead of
            switching off, on the same 0-255 scale as the phase
            brightnesses. 0 means it goes dark, which is the default.
          default: 0
          selector:
            number:
              min: 0
              max: 255
              mode: box
    timing:
      name: Timing
      icon: mdi:timer-outline
      collapsed: true
      input:
        no_motion_wait:
          name: Wait time
          description: Time to keep the light on after motion stops.
          default: 120
          selector:
            number:
              min: 0
              max: 3600
              unit_of_measurement: seconds
        update_interval:
          name: Update Interval (Optional)
          description: >
            How often to check the lights are up to date, outside of a
            phase change or motion - if everything's already correct,
            nothing is sent. Home Assistant's time_pattern syntax, e.g.
            '/1' for every minute.
            [Details](https://www.home-assistant.io/docs/automation/trigger/#time-pattern-trigger).
          default: "/1"
          selector:
            text: {}
        motion_on_transition:
          name: Motion On Transition
          description: Transition duration when turning on via motion or a manual run.
          default: 1
          selector:
            number:
              min: 0
              max: 60
              unit_of_measurement: seconds
        motion_off_transition:
          name: Motion Off Transition
          description: Transition duration when turning off via motion.
          default: 15
          selector:
            number:
              min: 0
              max: 60
              unit_of_measurement: seconds
        background_transition:
          name: Background Transition
          description: Transition duration when the schedule, the scene template, or an Additional Trigger updates - i.e. nothing a person is actively waiting on.
          default: 5
          selector:
            number:
              min: 0
              max: 60
              unit_of_measurement: seconds

mode: restart
max_exceeded: silent

# Available to triggers and conditions, unlike variables:.
trigger_variables:
  room_target: !input room_target

trigger:
  # `to:` stops attribute-only updates firing it; `from:` is open so a
  # restart still fires.
  - platform: state
    entity_id: !input adaptive_sensor
    id: phase_change
    to:
      - Morning
      - Day
      - Evening
      - Night
  # The curve is flat in Morning/Night, so phase_change goes quiet there.
  # Also runs self-heal.
  - id: tick
    platform: time_pattern
    minutes: !input update_interval
  - id: extra
    platform: state
    entity_id: !input extra_triggers
  # Harmless with no occupancy sensor in the room.
  - id: motion_on
    trigger: occupancy.detected
    target: !input room_target
  - id: motion_off
    trigger: occupancy.cleared
    target: !input room_target
    options:
      for:
        seconds: !input no_motion_wait
  - id: recovered
    platform: template
    value_template: >
      {#
        Runs an ordinary tick as soon as a light becomes reachable, rather
        than waiting for the next one. "At least one reachable", not "none
        unavailable", so a dead entity can't block it; a bulb recovering
        beside reachable siblings waits for the tick. Can't use `trigger.*`,
        which isn't in scope here.
      #}
      {% set ns = namespace(entities=[]) %}
      {% if room_target is not none %}
        {% if room_target.entity_id is defined %}
          {% set eids = room_target.entity_id if room_target.entity_id is iterable and room_target.entity_id is not string else [room_target.entity_id] %}
          {% set ns.entities = ns.entities + (eids | select('match', '^light\\.') | list) %}
        {% endif %}
        {% if room_target.device_id is defined %}
          {% set dids = room_target.device_id if room_target.device_id is iterable and room_target.device_id is not string else [room_target.device_id] %}
          {% for d in dids %}
            {% set ns.entities = ns.entities + (device_entities(d) | select('match', '^light\\.') | list) %}
          {% endfor %}
        {% endif %}
        {% if room_target.area_id is defined %}
          {% set aids = room_target.area_id if room_target.area_id is iterable and room_target.area_id is not string else [room_target.area_id] %}
          {% for a in aids %}
            {% set ns.entities = ns.entities + (area_entities(a) | select('match', '^light\\.') | list) %}
          {% endfor %}
        {% endif %}
      {% endif %}
      {% set light_entity_ids = ns.entities | unique | list %}
      {{ light_entity_ids
         | reject('is_state', 'unavailable') | reject('is_state', 'unknown')
         | list | length > 0 }}

condition:
  # Never checks occupancy: an already-on light should follow the curve
  # regardless. allow_turn_on decides whether lights may come on.
  #
  # motion_on is skipped if there's nothing to do - nothing off and nothing
  # idle. `idle_entities`, not `room_is_idle`, which is false once motion
  # starts.
  - alias: "Every trigger passes except an unproductive motion_on tick"
    or:
      - alias: "Not a motion_on run"
        not:
          - condition: trigger
            alias: "Triggered by motion_on"
            id: motion_on
      - alias: "A motion_on run with something to actually turn on"
        and:
          - condition: trigger
            alias: "Triggered by motion_on"
            id: motion_on
          - condition: template
            alias: "Something in the room is off, or has an idle level"
            value_template: >-
              {{ resolved_entities | map('states') | select('ne', 'on') | list | count > 0
                 or idle_entities | length > 0 }}

variables:
  room_target: !input room_target
  adaptive_sensor: !input adaptive_sensor
  scene_template: !input scene_template
  background_transition: !input background_transition
  motion_on_transition: !input motion_on_transition
  no_motion_wait: !input no_motion_wait
  rgb_phases: !input rgb_phases
  phase: "{{ states(adaptive_sensor) }}"
  prefer_rgb_color: "{{ phase in rgb_phases }}"
  script_transition: >
    {# Slow for background updates; quick for motion or a manual run. #}
    {% if trigger is defined and trigger.id is defined and trigger.id in ['phase_change', 'tick', 'extra', 'recovered'] %}
      {{ background_transition }}
    {% else %}
      {{ motion_on_transition }}
    {% endif %}
  # Nothing triggered this run: "Run" was pressed, or automation.trigger
  # was called. Forces the tick through override protection.
  manual_run: "{{ not (trigger is defined and trigger.id is defined) }}"
  # room_target resolved once (entity/device/area; not floor/label). Kept
  # as two halves: a named light also pulls in its device's siblings, which
  # the device/area half already includes.
  target_named_entities: >
    {% if room_target is not none and room_target.entity_id is defined %}
      {% set v = room_target.entity_id %}
      {{ v if v is iterable and v is not string else [v] }}
    {% else %}
      {{ [] }}
    {% endif %}
  target_expanded_entities: >
    {% set ns = namespace(entities=[]) %}
    {% if room_target is not none %}
      {% if room_target.device_id is defined %}
        {% set v = room_target.device_id %}
        {% for d in (v if v is iterable and v is not string else [v]) %}
          {% set ns.entities = ns.entities + device_entities(d) %}
        {% endfor %}
      {% endif %}
      {% if room_target.area_id is defined %}
        {% set v = room_target.area_id %}
        {% for a in (v if v is iterable and v is not string else [v]) %}
          {% set ns.entities = ns.entities + area_entities(a) %}
        {% endfor %}
      {% endif %}
    {% endif %}
    {{ ns.entities | unique | list }}
  all_target_entities: >
    {{ (target_named_entities + target_expanded_entities) | unique | list }}
  resolved_entities: >
    {{ all_target_entities | select('match', '^light\\.') | list }}
  # Up here because variables: render top to bottom and the turn-off lists
  # below need it.
  template_brightness_levels: !input brightness_template
  morning_exclude_lights: !input morning_exclude_lights
  day_exclude_lights: !input day_exclude_lights
  evening_exclude_lights: !input evening_exclude_lights
  night_exclude_lights: !input night_exclude_lights
  phase_exclude_lights: >
    {% set m = {'Morning': morning_exclude_lights, 'Day': day_exclude_lights,
                'Evening': evening_exclude_lights, 'Night': night_exclude_lights} %}
    {{ m.get(phase, []) }}
  # The template wins over the per-phase exclude list. A single number from
  # the template means every light in the room.
  template_brightness_map: >
    {% set t = template_brightness_levels %}
    {% if t is mapping %}
      {{ t }}
    {% elif t is not none and (t | string | trim) != '' and (t | float(-1)) >= 0 %}
      {% set ns = namespace(m={}) %}
      {% for e in resolved_entities %}
        {% set ns.m = dict(ns.m, **{e: t | float}) %}
      {% endfor %}
      {{ ns.m }}
    {% else %}
      {{ {} }}
    {% endif %}
  brightness_levels: >
    {% set ns = namespace(m={}) %}
    {% for e in phase_exclude_lights %}
      {% set ns.m = dict(ns.m, **{e: 0}) %}
    {% endfor %}
    {{ dict(ns.m, **template_brightness_map) }}
  # Lights handed off with a null/false level ("something else owns
  # this"), unlike 0 ("turn off"). `is sameas false`, since `0 == false`
  # in Jinja. Excluded from the turn-offs too.
  hands_off_entities: >
    {% set ns = namespace(items=[]) %}
    {% for entity_id, level in brightness_levels.items() %}
      {% if level is none or level is sameas false %}
        {% set ns.items = ns.items + [entity_id] %}
      {% endif %}
    {% endfor %}
    {{ ns.items }}
  brightness: "{{ state_attr(adaptive_sensor, 'brightness') }}"
  color_temp_kelvin: "{{ state_attr(adaptive_sensor, 'color_temp') }}"
  # None if the sensor doesn't publish rgb_color.
  rgb_color: "{{ state_attr(adaptive_sensor, 'rgb_color') }}"
  # Levels are absolute brightness, sent as brightness 255 with a
  # multiplier of level/255. Every light needs an entry, since a missing
  # one defaults to multiplier 1 (full). The curve is floored at 1 so a
  # schedule brightness of 0 isn't "off". 0 and null/false pass through as
  # the off and hands-off sentinels.
  brightness_multipliers: >
    {% set curve = ([brightness | float(0), 1] | max) / 255 %}
    {% set ns = namespace(m={}) %}
    {% for e in resolved_entities %}
      {% set ns.m = dict(ns.m, **{e: curve}) %}
    {% endfor %}
    {% for entity_id, level in brightness_levels.items() %}
      {% if level is none or level is sameas false %}
        {% set ns.m = dict(ns.m, **{entity_id: level}) %}
      {% else %}
        {% set ns.m = dict(ns.m, **{entity_id: (level | float) / 255}) %}
      {% endif %}
    {% endfor %}
    {{ ns.m }}
  # This room's tracking scope: an area named in Room Target, else the
  # area of the first resolved light that has a scope. Only finds scopes
  # targeting a single area. None means untracked.
  tracking_scope_device_id: >
    {% if room_target is not none and room_target.area_id is defined %}
      {% set aids = room_target.area_id %}
      {% set aid = (aids if aids is iterable and aids is not string else [aids]) | first %}
    {% else %}
      {% set candidate_areas = resolved_entities | map('area_id') | reject('none') | unique | list %}
      {% set aid = candidate_areas | first if candidate_areas | length > 0 else none %}
    {% endif %}
    {% set tracking_entities = area_entities(aid) | select('search', '^sensor\\..*_flare_tracking$') | list if aid is not none else [] %}
    {{ device_id(tracking_entities | first) if tracking_entities | length > 0 else none }}
  # Up here because the turn-off lists below exclude idle lights. Empty
  # means dark.
  template_idle_brightness: !input idle_brightness_template
  morning_idle_brightness: !input morning_idle_brightness
  day_idle_brightness: !input day_idle_brightness
  evening_idle_brightness: !input evening_idle_brightness
  night_idle_brightness: !input night_idle_brightness
  phase_idle_brightness: >
    {% set m = {'Morning': morning_idle_brightness, 'Day': day_idle_brightness,
                'Evening': evening_idle_brightness, 'Night': night_idle_brightness} %}
    {{ m.get(phase, 0) | int }}
  # Same precedence as brightness_levels.
  template_idle_map: >
    {% set t = template_idle_brightness %}
    {% if t is mapping %}
      {{ t }}
    {% elif t is not none and (t | string | trim) != '' and (t | float(-1)) >= 0 %}
      {% set ns = namespace(m={}) %}
      {% for e in resolved_entities %}
        {% set ns.m = dict(ns.m, **{e: t | float}) %}
      {% endfor %}
      {{ ns.m }}
    {% else %}
      {{ {} }}
    {% endif %}
  idle_brightness: >
    {% set ns = namespace(m={}) %}
    {% if phase_idle_brightness %}
      {% for e in resolved_entities %}
        {% set ns.m = dict(ns.m, **{e: phase_idle_brightness}) %}
      {% endfor %}
    {% endif %}
    {{ dict(ns.m, **template_idle_map) }}
  # Lights that stay lit when the room empties. A null level outranks an
  # idle one.
  idle_entities: >
    {% set ns = namespace(items=[]) %}
    {% for e, level in idle_brightness.items() %}
      {% if level and e in resolved_entities and e not in hands_off_entities %}
        {% set ns.items = ns.items + [e] %}
      {% endif %}
    {% endfor %}
    {{ ns.items }}
  # Minus hands-off lights. Only feeds the motion_off turn-off.
  reachable_entities: >
    {{ resolved_entities | reject('is_state', 'unavailable') | reject('is_state', 'unknown')
       | reject('in', hands_off_entities) | list }}
  turn_off_entities: >
    {{ reachable_entities | reject('in', idle_entities) | list }}
  # Same shape as brightness_multipliers.
  idle_multipliers: >
    {% set ns = namespace(m={}) %}
    {% for e in idle_entities %}
      {% set ns.m = dict(ns.m, **{e: (idle_brightness[e] | float) / 255}) %}
    {% endfor %}
    {{ ns.m }}
  # Only to know whether the room has an occupancy sensor at all.
  room_occupancy_entities: >
    {{ all_target_entities | select('match', '^binary_sensor\\.')
       | select('is_state_attr', 'device_class', 'occupancy') | list }}
  # No occupancy sensor on, or changed, within the Wait time. Hand-written
  # because occupancy.is_not_detected's `for:` isn't reliable after a
  # restart. Only `on` counts as occupied, so a sensor left unavailable
  # can't hold the room on forever. True with no sensors, so callers also
  # check room_occupancy_entities.
  occupancy_clear_for_wait: >
    {% set ns = namespace(all_clear=true) %}
    {% for e in room_occupancy_entities %}
      {% if is_state(e, 'on') or
            (now() - states[e].last_changed).total_seconds() < (no_motion_wait | int) %}
        {% set ns.all_clear = false %}
      {% endif %}
    {% endfor %}
    {{ ns.all_clear }}
  # Empty, with lights that stay dimly lit. Suppresses the curve while
  # idle: an idle light being on makes `occupied`, and so allow_turn_on,
  # true, which would ramp the nightlight straight back up.
  room_is_idle: >
    {{ idle_entities | length > 0
       and room_occupancy_entities | length > 0
       and occupancy_clear_for_wait }}
  occupied: >
    {# The room is in use if anything is already on. #}
    {{ resolved_entities | map('states') | select('eq', 'on') | list | count > 0 }}
  # THE gate for switching a light on: motion, a manual run, or the room
  # already in use. Only two things may switch a light on:
  #
  #   scene.turn_on / flare.apply_lighting - inside default:'s single
  #     `if allow_turn_on` block.
  #   flare.apply_lighting for idle brightness - gated on idle_entities and
  #     occupancy_clear_for_wait instead.
  #
  # Anything new that can switch a light on needs one of those gates. The
  # idle gate must stay narrower than allow_turn_on, and must not be gated
  # on `occupied`, which an idle light makes true.
  allow_turn_on: >
    {{ manual_run
       or (trigger is defined and trigger.id is defined and trigger.id == 'motion_on')
       or occupied }}
  # Retried by self-heal. Excludes hands-off and idle lights.
  entities_still_on: >
    {{ resolved_entities | select('is_state', 'on')
       | reject('in', hands_off_entities) | reject('in', idle_entities) | list }}
  # Every entity on each light's device, for scene-compatibility checks.
  scope_entities: >
    {% set ns = namespace(entities=target_expanded_entities) %}
    {% for e in (target_named_entities | select('match', '^light\\.') | list) %}
      {% set did = device_id(e) %}
      {% set ns.entities = ns.entities + (device_entities(did) if did else [e]) %}
    {% endfor %}
    {{ ns.entities | unique | list }}
  morning_scene: !input morning_scene
  day_scene: !input day_scene
  evening_scene: !input evening_scene
  night_scene: !input night_scene
  phase_scene: >
    {% set m = {'Morning': morning_scene, 'Day': day_scene, 'Evening': evening_scene, 'Night': night_scene} %}
    {{ m.get(phase) }}
  # scene_template wins when it returns a valid scene; a typo or missing
  # scene counts as nothing. The entity_id shape check has to come first:
  # states[] raises on a malformed string, aborting the whole run.
  desired_scene: >
    {% set candidate = (scene_template | trim) %}
    {% if candidate and candidate is match('^[a-z0-9_]+\\.[a-z0-9_]+$') and states[candidate] is not none %}
      {{ candidate }}
    {% elif phase_scene and states[phase_scene] is not none %}
      {{ phase_scene }}
    {% else %}
      {{ '' }}
    {% endif %}
  scene_covered_entities: >
    {% if desired_scene | length > 0 %}
      {{ state_attr(desired_scene, 'entity_id') | default([], true) | list }}
    {% else %}
      {{ [] }}
    {% endif %}
  # Usable only if everything the scene covers is within our scope.
  scene_valid: "{{ scene_covered_entities | reject('in', scope_entities) | list | length == 0 }}"
  scene_active: "{{ desired_scene | length > 0 and scene_valid }}"
  # Lights handed off this tick - to an active scene, or via a null/false
  # level. They're never written, so their claims are released instead of
  # going stale into "overridden".
  handed_off_entities: >
    {{ ((scene_covered_entities if scene_active else []) + hands_off_entities) | unique | list }}
  # Re-activating a scene every minute would stomp manual changes, so a
  # phase_change is skipped unless the phase really changed. The tick has
  # no from_state/to_state to compare, so it's excluded.
  scene_recheck_due: >
    {% if trigger is defined and trigger.id is defined and trigger.id == 'tick' %}
      false
    {% else %}
      {{ not (trigger is defined and trigger.id is defined and trigger.id == 'phase_change')
         or trigger.from_state is none
         or trigger.to_state is none
         or trigger.from_state.state != trigger.to_state.state }}
    {% endif %}
  # Everything the active scene doesn't cover. No off-light filter: the
  # step using it is already behind allow_turn_on.
  target_entities: >
    {{ resolved_entities | reject('in', scene_covered_entities) | list if scene_active else resolved_entities }}
action:
  - choose:
      # occupancy.cleared's `for:` is per sensor, so it fires once each
      # sensor's own Wait time is up, even if another saw motion since.
      - alias: "Motion timed out and the room is confirmed empty"
        conditions:
          - condition: trigger
            alias: "Triggered by motion_off"
            id: motion_off
          - condition: template
            alias: "Every occupancy sensor has been clear for the full Wait time"
            value_template: "{{ occupancy_clear_for_wait }}"
        sequence:
          # flare.turn_off records the turn-off as ours, so it isn't read as an
          # override.
          - alias: "Turn off the light(s)"
            action: flare.turn_off
            data:
              entities: "{{ turn_off_entities }}"
              transition: !input motion_off_transition
              tracking_device_id: "{{ tracking_scope_device_id }}"
          # Idle lights are dimmed instead. Does nothing with no idle brightness.
          - alias: "Leave the idle-brightness lights dimly lit"
            if:
              - condition: template
                alias: "Room has idle-brightness lights to dim"
                value_template: "{{ idle_entities | length > 0 }}"
            then:
              - action: flare.apply_lighting
                data:
                  entities: "{{ idle_entities }}"
                  brightness_multipliers: "{{ idle_multipliers }}"
                  brightness: 255
                  color_temp_kelvin: "{{ color_temp_kelvin }}"
                  rgb_color: "{{ rgb_color }}"
                  transition: !input motion_off_transition
                  prefer_rgb_color: "{{ prefer_rgb_color }}"
                  tracking_device_id: "{{ tracking_scope_device_id }}"
      # Self-heal: on a tick, with the room empty, retry turn-offs that didn't
      # land. Exclusive of default:, which would work from the same stale list.
      - alias: "Self-heal: retry an earlier turn-off that didn't land"
        conditions:
          # phase_change too: moving to a phase with no idle brightness leaves
          # lights on that no longer read as idle.
          - condition: trigger
            alias: "Triggered by the periodic tick or a phase change"
            id:
              - tick
              - phase_change
          - condition: template
            alias: "Room has an occupancy sensor to reconcile against"
            value_template: "{{ room_occupancy_entities | length > 0 }}"
          # Continuously clear for the full Wait time, so a sensor blip can't turn
          # lights off.
          - condition: template
            alias: "Occupancy has been clear for the full Wait time"
            value_template: "{{ occupancy_clear_for_wait }}"
          - condition: template
            alias: "Something in the room is still on"
            value_template: "{{ entities_still_on | length > 0 }}"
        sequence:
          - alias: "Self-heal: retry turning off lights left on with no occupancy"
            action: flare.turn_off
            data:
              entities: "{{ entities_still_on }}"
              transition: !input motion_off_transition
              tracking_device_id: "{{ tracking_scope_device_id }}"
    default:
      # Everything that can switch a light on is under this gate (see
      # allow_turn_on). An empty room settles to its idle brightness, outside
      # the gate. room_occupancy_entities is checked because
      # occupancy.is_detected is false with no sensors.
      - alias: "Settle an empty room to its idle brightness"
        if:
          - condition: template
            alias: "Room is idle, and the sensor has a colour target"
            value_template: "{{ room_is_idle and color_temp_kelvin is not none }}"
        then:
          - alias: "Apply idle brightness (FLARE)"
            action: flare.apply_lighting
            data:
              entities: "{{ idle_entities }}"
              brightness_multipliers: "{{ idle_multipliers }}"
              brightness: 255
              color_temp_kelvin: "{{ color_temp_kelvin }}"
              rgb_color: "{{ rgb_color }}"
              transition: "{{ script_transition }}"
              prefer_rgb_color: "{{ prefer_rgb_color }}"
              tracking_device_id: "{{ tracking_scope_device_id }}"
      - alias: "Only motion, a manual run, or a room already in use may switch a light on"
        if:
          - condition: template
            alias: "Allowed to turn on, and not already handled by the idle nightlight"
            # Stops the nightlight ramping itself back up (see room_is_idle).
            value_template: "{{ allow_turn_on and not room_is_idle }}"
        then:
          - alias: "Activate a scene, if one applies and is due a recheck"
            if:
              - condition: template
                alias: "A scene applies and is due a recheck"
                value_template: "{{ scene_active and scene_recheck_due }}"
            then:
              - alias: "Activate matching scene"
                action: scene.turn_on
                target:
                  entity_id: "{{ desired_scene }}"
                data:
                  transition: "{{ script_transition }}"
          # Guarded because the sensor attributes render null when the sensor is
          # unavailable, and apply_lighting requires both.
          - alias: "Apply adaptive lighting, unless the sensor has no target to apply"
            if:
              - condition: template
                alias: "Sensor has a real brightness and colour target"
                value_template: "{{ brightness is not none and color_temp_kelvin is not none }}"
            then:
              - alias: "Apply adaptive lighting (FLARE)"
                action: flare.apply_lighting
                data:
                  entities: "{{ target_entities }}"
                  brightness_multipliers: "{{ brightness_multipliers }}"
                  brightness: 255
                  color_temp_kelvin: "{{ color_temp_kelvin }}"
                  rgb_color: "{{ rgb_color }}"
                  transition: "{{ script_transition }}"
                  prefer_rgb_color: "{{ prefer_rgb_color }}"
                  tracking_device_id: "{{ tracking_scope_device_id }}"
                  # A manual run forces the tick through override protection.
                  force: "{{ manual_run }}"
      # Bookkeeping only, so outside the gate. claims_clear needs a scope.
      - alias: "Release lights handed off to a scene or another owner"
        if:
          - condition: template
            alias: "There are lights to release, and a scope to release them from"
            value_template: >-
              {{ handed_off_entities | length > 0 and tracking_scope_device_id is not none }}
        then:
          - action: flare.claims_clear
            data:
              entities: "{{ handed_off_entities }}"
              tracking_device_id: "{{ tracking_scope_device_id }}"
