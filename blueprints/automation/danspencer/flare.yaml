blueprint:
  name: FLARE
  description: >
    FLARE: phase-based circadian lighting - sets brightness/colour
    temperature from a FLARE schedule sensor,
    keeping lights updated as it changes, and turns them off a while
    after occupancy clears. Full details on every input:
    [the blueprint reference](https://danrspencer.github.io/flare/blueprint/).


    Blueprint version 0.0.0-dev - the integration raises a repair when a
    newer one is available.
  domain: automation
  source_url: https://github.com/danrspencer/flare/blob/main/blueprints/automation/danspencer/flare.yaml
  author: Dan Spencer
  homeassistant:
    # Required by the occupancy.* triggers/conditions below (see CLAUDE.md).
    min_version: 2026.4.0
  input:
    adaptive_sensor:
      name: FLARE Sensor
      description: >
        Sensor providing brightness and colour temperature to apply -
        filtered to FLARE's own schedule sensors.
      selector:
        entity:
          filter:
            - integration: flare
              domain: sensor
    room_target:
      name: Lights & Occupancy
      description: >
        Entity, device, area, floor, or label - lights within it are
        controlled, occupancy-class sensors within it decide when.
        [Details](https://danrspencer.github.io/flare/blueprint/#setting-up-a-room).
      default: {}
      selector:
        target:
          entity:
            - domain: light
            - domain: binary_sensor
              device_class: occupancy
    extra_triggers:
      name: Additional Triggers (Optional)
      description: >
        Entities that trigger an immediate re-evaluation, e.g. a
        dependency of Scene Template or Brightness Template.
        Only updates lights that are already on - never switches one on.
        [Details](https://danrspencer.github.io/flare/blueprint/#additional-triggers).
      default: []
      selector:
        entity:
          multiple: true
    colour:
      name: Colour
      icon: mdi:palette
      collapsed: true
      input:
        rgb_phases:
          name: Prefer RGB During
          description: >
            Phases to send RGB colour instead of colour temperature, for
            lights that support it (auto-detected). At the high colour
            temperatures used during Morning/Day, this can look
            blue-tinted rather than a clean white, so those phases are
            off by default - Evening/Night's warmer values don't have
            that problem.
            [Details](https://danrspencer.github.io/flare/blueprint/#colour).
          default: [Evening, Night]
          selector:
            select:
              options: [Morning, Day, Evening, Night]
              multiple: true
    scene_handoff:
      name: Scene Handoff
      icon: mdi:palette-swatch
      collapsed: true
      input:
        scene_template:
          name: Scene Template (Optional)
          description: >
            Template returning a scene entity_id to hand the room over
            to instead of the adaptive brightness/colour. Takes
            precedence over the per-phase scenes below whenever it
            returns one - they're the fallback for phases it doesn't
            cover.
            [Details](https://danrspencer.github.io/flare/blueprint/#handing-a-room-to-a-scene).
          default: ""
          selector:
            template: {}
        morning_scene:
          name: Morning Scene (Optional)
          default: null
          selector:
            entity:
              domain: scene
        day_scene:
          name: Day Scene (Optional)
          default: null
          selector:
            entity:
              domain: scene
        evening_scene:
          name: Evening Scene (Optional)
          default: null
          selector:
            entity:
              domain: scene
        night_scene:
          name: Night Scene (Optional)
          default: null
          selector:
            entity:
              domain: scene
    brightness_exclusions:
      name: Brightness & Exclusions
      icon: mdi:brightness-percent
      collapsed: true
      input:
        brightness_template:
          name: Brightness Template (Optional)
          description: >
            Template returning entity_id → brightness, 0-255, replacing
            the curve's brightness for the lights it names (0 = off, null
            = skip entirely). The same scale the phase brightnesses use.
            Its own per-entity values always win over the per-phase
            exclusions below - those only fill in entities it doesn't
            already mention.
            [Details](https://danrspencer.github.io/flare/blueprint/#turning-lights-off-during-a-phase).
          default: "{{ {} }}"
          selector:
            template: {}
        morning_exclude_lights:
          name: Lights Off During Morning (Optional)
          selector:
            entity:
              domain: light
              multiple: true
          default: []
        day_exclude_lights:
          name: Lights Off During Day (Optional)
          selector:
            entity:
              domain: light
              multiple: true
          default: []
        evening_exclude_lights:
          name: Lights Off During Evening (Optional)
          selector:
            entity:
              domain: light
              multiple: true
          default: []
        night_exclude_lights:
          name: Lights Off During Night (Optional)
          selector:
            entity:
              domain: light
              multiple: true
          default: []
    idle_brightness:
      name: Idle Brightness
      icon: mdi:lightbulb-night
      collapsed: true
      input:
        idle_brightness_template:
          name: Idle Brightness Template (Optional)
          description: >
            Template returning entity_id → brightness, 1-255, for
            lights that should stay dimly lit when the room is empty,
            instead of switching off. Its own per-entity values always
            win over the per-phase settings below - those only fill in
            entities it doesn't already mention.
            [Details](https://danrspencer.github.io/flare/blueprint/#leaving-a-room-dimly-lit).
          default: "{{ {} }}"
          selector:
            template: {}
        morning_idle_brightness:
          name: Morning Idle Brightness (Optional)
          description: >
            What this phase dims to when the room is empty, instead of
            switching off, on the same 0-255 scale as the phase
            brightnesses. 0 means it goes dark, which is the default.
          default: 0
          selector:
            number:
              min: 0
              max: 255
              mode: box
        day_idle_brightness:
          name: Day Idle Brightness (Optional)
          description: >
            What this phase dims to when the room is empty, instead of
            switching off, on the same 0-255 scale as the phase
            brightnesses. 0 means it goes dark, which is the default.
          default: 0
          selector:
            number:
              min: 0
              max: 255
              mode: box
        evening_idle_brightness:
          name: Evening Idle Brightness (Optional)
          description: >
            What this phase dims to when the room is empty, instead of
            switching off, on the same 0-255 scale as the phase
            brightnesses. 0 means it goes dark, which is the default.
          default: 0
          selector:
            number:
              min: 0
              max: 255
              mode: box
        night_idle_brightness:
          name: Night Idle Brightness (Optional)
          description: >
            What this phase dims to when the room is empty, instead of
            switching off, on the same 0-255 scale as the phase
            brightnesses. 0 means it goes dark, which is the default.
          default: 0
          selector:
            number:
              min: 0
              max: 255
              mode: box
    timing:
      name: Timing
      icon: mdi:timer-outline
      collapsed: true
      input:
        no_motion_wait:
          name: Wait time
          description: Time to keep the light on after motion stops.
          default: 120
          selector:
            number:
              min: 0
              max: 3600
              unit_of_measurement: seconds
        update_interval:
          name: Update Interval (Optional)
          description: >
            How often to check the lights are up to date, outside of a
            phase change or motion - if everything's already correct,
            nothing is sent. Home Assistant's time_pattern syntax, e.g.
            '/1' for every minute.
            [Details](https://www.home-assistant.io/docs/automation/trigger/#time-pattern-trigger).
          default: "/1"
          selector:
            text: {}
        motion_on_transition:
          name: Motion On Transition
          description: Transition duration when turning on via motion or a manual run.
          default: 1
          selector:
            number:
              min: 0
              max: 60
              unit_of_measurement: seconds
        motion_off_transition:
          name: Motion Off Transition
          description: Transition duration when turning off via motion.
          default: 15
          selector:
            number:
              min: 0
              max: 60
              unit_of_measurement: seconds
        background_transition:
          name: Background Transition
          description: Transition duration when the schedule, the scene template, or an Additional Trigger updates - i.e. nothing a person is actively waiting on.
          default: 5
          selector:
            number:
              min: 0
              max: 60
              unit_of_measurement: seconds

mode: restart
max_exceeded: silent

# Available to trigger:/condition: themselves, unlike variables: below
# (not computed until after a trigger fires) - needed so `recovered`'s
# own template can resolve room_target into light entities itself.
trigger_variables:
  room_target: !input room_target

trigger:
  # Fires only on a genuine phase change, not the attribute-only ticks
  # during a ramp (tick below covers those). The `to:` list is
  # what does this - a plain state trigger with no from:/to: also fires
  # on attribute-only changes. `from:` is left open so a restart or
  # first-ever value still fires.
  - platform: state
    entity_id: !input adaptive_sensor
    id: phase_change
    to:
      - Morning
      - Day
      - Evening
      - Night
  # Periodic floor tick - the only driver of tracking during Morning/
  # Night, where the curve is flat and phase_change never fires. Also
  # hosts the self-heal check (see action:). A separate id from
  # `phase_change` because scene_recheck_due reads
  # trigger.from_state/to_state, which a time_pattern trigger has no
  # equivalent of.
  - id: tick
    platform: time_pattern
    minutes: !input update_interval
  # Anything named in Additional Triggers changed - e.g. a TV for a
  # brightness template, or whatever the scene template depends on
  - id: extra
    platform: state
    entity_id: !input extra_triggers
  # Room's occupancy-class sensors just reported occupied, via HA's
  # native Occupancy trigger. Always attached, even with no occupancy
  # sensor in the room - a target matching zero entities is a harmless
  # no-op (see CLAUDE.md).
  - id: motion_on
    trigger: occupancy.detected
    target: !input room_target
  # Room's occupancy-class sensors have been continuously clear for no_motion_wait
  - id: motion_off
    trigger: occupancy.cleared
    target: !input room_target
    options:
      for:
        seconds: !input no_motion_wait
  - id: recovered
    platform: template
    value_template: >
      {#
        Fires promptly when a light in the room recovers from
        unavailable/unknown, rather than waiting for the next unrelated
        tick. No special handling beyond causing an ordinary tick to
        run: off stays off, on gets corrected via the usual
        target_entities/allow_turn_on logic.

        Needed because write_tracking.py clears an entity's override-
        protection record the moment it goes unavailable, so nothing
        else prompts a resync once it reconnects.

        Can't reference `trigger.*` here - this value_template renders
        with only trigger_variables in scope; `trigger` is injected
        afterwards, into the fired action only
        (homeassistant/components/template/trigger.py).

        The aggregate is "at least one of our lights is reachable", not
        "none unavailable" - the latter means one permanently-
        unavailable orphan entity blocks recovery for the whole room
        forever. Accepted blind spot: a bulb recovering beside already-
        reachable siblings doesn't fire this; the periodic tick mops
        that up.
      #}
      {% set ns = namespace(entities=[]) %}
      {% if room_target is not none %}
        {% if room_target.entity_id is defined %}
          {% set eids = room_target.entity_id if room_target.entity_id is iterable and room_target.entity_id is not string else [room_target.entity_id] %}
          {% set ns.entities = ns.entities + (eids | select('match', '^light\\.') | list) %}
        {% endif %}
        {% if room_target.device_id is defined %}
          {% set dids = room_target.device_id if room_target.device_id is iterable and room_target.device_id is not string else [room_target.device_id] %}
          {% for d in dids %}
            {% set ns.entities = ns.entities + (device_entities(d) | select('match', '^light\\.') | list) %}
          {% endfor %}
        {% endif %}
        {% if room_target.area_id is defined %}
          {% set aids = room_target.area_id if room_target.area_id is iterable and room_target.area_id is not string else [room_target.area_id] %}
          {% for a in aids %}
            {% set ns.entities = ns.entities + (area_entities(a) | select('match', '^light\\.') | list) %}
          {% endfor %}
        {% endif %}
      {% endif %}
      {% set light_entity_ids = ns.entities | unique | list %}
      {{ light_entity_ids
         | reject('is_state', 'unavailable') | reject('is_state', 'unknown')
         | list | length > 0 }}

condition:
  # condition: never checks occupancy - phase_change/extra/recovered
  # always proceed (an already-on light should track the curve
  # regardless of who's in the room); motion_on keeps only an
  # efficiency check (skip if there's nothing to turn on). allow_turn_on
  # below decides actual permission.
  #
  # `or idle_entities` is what lets motion work in an idle (dimly-lit)
  # room: "is anything off?" alone is a false negative there, since
  # every light is already ON at its idle level. Must be `idle_entities`
  # specifically, not `room_is_idle` - the latter includes
  # occupancy_clear_for_wait, which is already false the instant motion
  # is detected.
  - alias: "Every trigger passes except an unproductive motion_on tick"
    or:
      - alias: "Not a motion_on run"
        not:
          - condition: trigger
            alias: "Triggered by motion_on"
            id: motion_on
      - alias: "A motion_on run with something to actually turn on"
        and:
          - condition: trigger
            alias: "Triggered by motion_on"
            id: motion_on
          - condition: template
            alias: "Something in the room is off, or has an idle level"
            value_template: >-
              {{ resolved_entities | map('states') | select('ne', 'on') | list | count > 0
                 or idle_entities | length > 0 }}

variables:
  room_target: !input room_target
  adaptive_sensor: !input adaptive_sensor
  scene_template: !input scene_template
  background_transition: !input background_transition
  motion_on_transition: !input motion_on_transition
  # Exposed as a variable, not just !input inline, so the self-heal
  # condition below can reference it in a Jinja template.
  no_motion_wait: !input no_motion_wait
  rgb_phases: !input rgb_phases
  phase: "{{ states(adaptive_sensor) }}"
  prefer_rgb_color: "{{ phase in rgb_phases }}"
  script_transition: >
    {# Slow, smooth transition for phase_change/extra/recovered updates -
       none of these are a person waiting on a response in real time,
       so there's no reason to snap. Snappier for actual motion or a
       manual run instead. #}
    {% if trigger is defined and trigger.id is defined and trigger.id in ['phase_change', 'tick', 'extra', 'recovered'] %}
      {{ background_transition }}
    {% else %}
      {{ motion_on_transition }}
    {% endif %}
  # True when nothing above triggered this run - the user hit "Run" on
  # the automation, or called automation.trigger directly. Forces the
  # tick through regardless of override protection. `trigger` itself is
  # still defined for a manual run; `trigger.id` isn't.
  manual_run: "{{ not (trigger is defined and trigger.id is defined) }}"
  # room_target resolved once here; the consumers below filter the
  # result. Entity/device/area only - floor/label aren't resolvable in
  # hand-rolled Jinja (occupancy.* has native support, this doesn't).
  #
  # Two halves, not one list: a directly *named* light also pulls in its
  # device's siblings while the device/area halves already return those,
  # so merging would widen scene scope.
  target_named_entities: >
    {% if room_target is not none and room_target.entity_id is defined %}
      {% set v = room_target.entity_id %}
      {{ v if v is iterable and v is not string else [v] }}
    {% else %}
      {{ [] }}
    {% endif %}
  target_expanded_entities: >
    {% set ns = namespace(entities=[]) %}
    {% if room_target is not none %}
      {% if room_target.device_id is defined %}
        {% set v = room_target.device_id %}
        {% for d in (v if v is iterable and v is not string else [v]) %}
          {% set ns.entities = ns.entities + device_entities(d) %}
        {% endfor %}
      {% endif %}
      {% if room_target.area_id is defined %}
        {% set v = room_target.area_id %}
        {% for a in (v if v is iterable and v is not string else [v]) %}
          {% set ns.entities = ns.entities + area_entities(a) %}
        {% endfor %}
      {% endif %}
    {% endif %}
    {{ ns.entities | unique | list }}
  all_target_entities: >
    {{ (target_named_entities + target_expanded_entities) | unique | list }}
  # Every light this automation is allowed to touch - room_target can
  # also directly name occupancy-class sensor entities, hence the filter.
  resolved_entities: >
    {{ all_target_entities | select('match', '^light\\.') | list }}
  # Resolved up here, before reachable_entities/entities_still_on below,
  # which need hands_off_entities for their turn-off lists - variables:
  # renders strictly top to bottom, so this can't move down.
  template_brightness_levels: !input brightness_template
  morning_exclude_lights: !input morning_exclude_lights
  day_exclude_lights: !input day_exclude_lights
  evening_exclude_lights: !input evening_exclude_lights
  night_exclude_lights: !input night_exclude_lights
  phase_exclude_lights: >
    {% set m = {'Morning': morning_exclude_lights, 'Day': day_exclude_lights,
                'Evening': evening_exclude_lights, 'Night': night_exclude_lights} %}
    {{ m.get(phase, []) }}
  # The per-phase exclude list only fills in entities the template
  # doesn't already mention - its per-entity values always win on
  # collision.
  # A template may return a mapping of entity_id -> level, or a single
  # number meaning "every light in this room" - the scalar form is
  # expanded here, once, so everything downstream only sees a mapping.
  # Anything else (empty, unset) means "no opinion", same as {}.
  template_brightness_map: >
    {% set t = template_brightness_levels %}
    {% if t is mapping %}
      {{ t }}
    {% elif t is not none and (t | string | trim) != '' and (t | float(-1)) >= 0 %}
      {% set ns = namespace(m={}) %}
      {% for e in resolved_entities %}
        {% set ns.m = dict(ns.m, **{e: t | float}) %}
      {% endfor %}
      {{ ns.m }}
    {% else %}
      {{ {} }}
    {% endif %}
  brightness_levels: >
    {% set ns = namespace(m={}) %}
    {% for e in phase_exclude_lights %}
      {% set ns.m = dict(ns.m, **{e: 0}) %}
    {% endfor %}
    {{ dict(ns.m, **template_brightness_map) }}
  # Lights the brightness template handed off entirely: null/false means
  # "something else owns this", vs. 0 meaning "turn this one off" - must
  # not be conflated, and `0 == false` in Jinja means an `in [none,
  # false]` test would wrongly swallow every 0 too. `is sameas false` is
  # an identity check, mirroring grouping.py's own bucketing.
  #
  # Used by the two turn-off paths below (motion_off and self-heal), so
  # a handed-off light is excluded from those too, not just from being
  # dimmed by apply_lighting.
  hands_off_entities: >
    {% set ns = namespace(items=[]) %}
    {% for entity_id, level in brightness_levels.items() %}
      {% if level is none or level is sameas false %}
        {% set ns.items = ns.items + [entity_id] %}
      {% endif %}
    {% endfor %}
    {{ ns.items }}
  # Extracted here as plain state_attr() reads and passed to
  # apply_lighting as literal values - it reads no sensor entity itself,
  # matching compute_lighting_groups exactly. It did read one internally
  # once; that was reverted deliberately and is meant to stay reverted
  # (see CLAUDE.md).
  brightness: "{{ state_attr(adaptive_sensor, 'brightness') }}"
  color_temp_kelvin: "{{ state_attr(adaptive_sensor, 'color_temp') }}"
  # None whenever adaptive_sensor doesn't populate this attribute (a
  # "bring your own sensor" entity may omit it) - apply_lighting's own
  # rgb_color field explicitly tolerates a literal null for this reason.
  rgb_color: "{{ state_attr(adaptive_sensor, 'rgb_color') }}"
  # Brightness levels converted to what apply_lighting takes: one
  # `brightness` plus per-entity MULTIPLIERS. Sends 255 and a multiplier
  # of level/255, so grouping.py's round(255 * multiplier) lands back on
  # the level - a FLAT target brightness, not a scaling of the curve.
  # idle_multipliers below does the same thing, deliberately, so a level
  # means the same thing in both places.
  #
  # EVERY resolved entity needs an entry - grouping.py defaults a
  # missing one to multiplier 1, full blast against a brightness of 255.
  # The curve value is floored at 1 first so a schedule brightness of 0
  # still lands on 1, matching grouping.py's own 1-255 clamp.
  #
  # 0 and null/false pass through unchanged - the two sentinels
  # grouping.py matches on identity (0 = off, null/false = hands off).
  brightness_multipliers: >
    {% set curve = ([brightness | float(0), 1] | max) / 255 %}
    {% set ns = namespace(m={}) %}
    {% for e in resolved_entities %}
      {% set ns.m = dict(ns.m, **{e: curve}) %}
    {% endfor %}
    {% for entity_id, level in brightness_levels.items() %}
      {% if level is none or level is sameas false %}
        {% set ns.m = dict(ns.m, **{entity_id: level}) %}
      {% else %}
        {% set ns.m = dict(ns.m, **{entity_id: (level | float) / 255}) %}
      {% endif %}
    {% endfor %}
    {{ ns.m }}
  # Which FLARE tracking scope this room's writes belong to, resolved
  # once here rather than left for the integration to search for. Room
  # Target naming an area directly wins outright; otherwise falls back
  # to the resolved lights' own area (first one with a state device).
  #
  # Only finds a scope whose target reduces to a single area (see
  # sensor.py's _assign_scope_area) - a scope spanning several areas, or
  # targeting devices/entities directly, isn't discoverable this way.
  # None means untracked, same as passing no scope to these services.
  tracking_scope_device_id: >
    {% if room_target is not none and room_target.area_id is defined %}
      {% set aids = room_target.area_id %}
      {% set aid = (aids if aids is iterable and aids is not string else [aids]) | first %}
    {% else %}
      {% set candidate_areas = resolved_entities | map('area_id') | reject('none') | unique | list %}
      {% set aid = candidate_areas | first if candidate_areas | length > 0 else none %}
    {% endif %}
    {% set tracking_entities = area_entities(aid) | select('search', '^sensor\\..*_flare_tracking$') | list if aid is not none else [] %}
    {{ device_id(tracking_entities | first) if tracking_entities | length > 0 else none }}
  # What the room sits at when nobody is in it. Unset everywhere and
  # this is empty, i.e. empty means dark.
  #
  # Declared here, before reachable_entities/entities_still_on which
  # must exclude these idle lights - variables: renders top to bottom,
  # so this can't move either way.
  template_idle_brightness: !input idle_brightness_template
  morning_idle_brightness: !input morning_idle_brightness
  day_idle_brightness: !input day_idle_brightness
  evening_idle_brightness: !input evening_idle_brightness
  night_idle_brightness: !input night_idle_brightness
  phase_idle_brightness: >
    {% set m = {'Morning': morning_idle_brightness, 'Day': day_idle_brightness,
                'Evening': evening_idle_brightness, 'Night': night_idle_brightness} %}
    {{ m.get(phase, 0) | int }}
  # Same precedence as brightness_levels: the per-phase value fills in
  # every light, the template's per-entity values win on collision.
  # Same scalar-or-mapping handling as template_brightness_map above.
  template_idle_map: >
    {% set t = template_idle_brightness %}
    {% if t is mapping %}
      {{ t }}
    {% elif t is not none and (t | string | trim) != '' and (t | float(-1)) >= 0 %}
      {% set ns = namespace(m={}) %}
      {% for e in resolved_entities %}
        {% set ns.m = dict(ns.m, **{e: t | float}) %}
      {% endfor %}
      {{ ns.m }}
    {% else %}
      {{ {} }}
    {% endif %}
  idle_brightness: >
    {% set ns = namespace(m={}) %}
    {% if phase_idle_brightness %}
      {% for e in resolved_entities %}
        {% set ns.m = dict(ns.m, **{e: phase_idle_brightness}) %}
      {% endfor %}
    {% endif %}
    {{ dict(ns.m, **template_idle_map) }}
  # Lights that should stay lit when the room empties. A light handed
  # off with a null level is excluded - that means "something else
  # owns this", which outranks an idle level.
  idle_entities: >
    {% set ns = namespace(items=[]) %}
    {% for e, level in idle_brightness.items() %}
      {% if level and e in resolved_entities and e not in hands_off_entities %}
        {% set ns.items = ns.items + [e] %}
      {% endif %}
    {% endfor %}
    {{ ns.items }}
  # Entities HA already knows it can't reach right now - no point
  # commanding them - minus anything the brightness template handed off
  # (see hands_off_entities above). Only feeds the motion_off turn-off.
  reachable_entities: >
    {{ resolved_entities | reject('is_state', 'unavailable') | reject('is_state', 'unknown')
       | reject('in', hands_off_entities) | list }}
  # What motion_off actually switches off: everything reachable except
  # the lights that are meant to stay dimly lit.
  turn_off_entities: >
    {{ reachable_entities | reject('in', idle_entities) | list }}
  # Idle levels expressed the way apply_lighting takes them - same
  # brightness-255-plus-multiplier shape as brightness_multipliers
  # above, so a level means the same thing whether the room is in use
  # or idle.
  idle_multipliers: >
    {% set ns = namespace(m={}) %}
    {% for e in idle_entities %}
      {% set ns.m = dict(ns.m, **{e: (idle_brightness[e] | float) / 255}) %}
    {% endfor %}
    {{ ns.m }}
  # room_target's occupancy-class binary_sensor entities. Only used to
  # decide *whether* Room has an occupancy sensor at all, for the
  # condition:/self-heal branches below - occupancy.is_detected itself
  # still does the real detection natively.
  room_occupancy_entities: >
    {{ all_target_entities | select('match', '^binary_sensor\\.')
       | select('is_state_attr', 'device_class', 'occupancy') | list }}
  # "Every occupancy sensor in the room has been off for the full Wait
  # time." Shared by self-heal and the idle-brightness branch.
  #
  # Hand-written rather than occupancy.is_not_detected's native `for:`,
  # which needs the recorder to prime a duration already satisfied
  # before it started watching - not reliable right after a restart.
  #
  # False when the room has no occupancy sensor at all - vacuously
  # clear otherwise, so the caller must also check
  # room_occupancy_entities itself.
  occupancy_clear_for_wait: >
    {% set ns = namespace(all_clear=true) %}
    {% for e in room_occupancy_entities %}
      {% if not is_state(e, 'off') or
            (now() - states[e].last_changed).total_seconds() < (no_motion_wait | int) %}
        {% set ns.all_clear = false %}
      {% endif %}
    {% endfor %}
    {{ ns.all_clear }}
  # "This room is empty and has lights that stay dimly lit when it is."
  #
  # LOAD-BEARING: an idle light being on makes `occupied` true, which
  # makes allow_turn_on true, which would ramp the nightlight straight
  # back up to full on the very next tick. This suppresses the curve
  # while idle, so the two branches in default: stay mutually exclusive.
  # Motion ends it immediately via occupancy_clear_for_wait.
  room_is_idle: >
    {{ idle_entities | length > 0
       and room_occupancy_entities | length > 0
       and occupancy_clear_for_wait }}
  occupied: >
    {#
      Is the room "in use" right now - feeds allow_turn_on below. With
      no occupancy sensor, the only signal is whether something's
      already on, which is imprecise but unavoidable without a sensor.
    #}
    {{ resolved_entities | map('states') | select('eq', 'on') | list | count > 0 }}
  # THE gate for switching a light on. Only three things may: motion
  # detecting someone, a deliberate manual run, or the room already in
  # active use. Applies uniformly to every trigger, recovered included -
  # condition: never gates on occupancy (see its own comment); this is
  # the only place that decides it.
  #
  # Load-bearing: grouping.py treats an off light as "not yet at target"
  # and would otherwise turn it back on from any tick, not just motion.
  #
  # STRUCTURAL INVARIANT - keep this true. Only two things in this
  # blueprint may switch a light on, and both are gated:
  #
  #   scene.turn_on / flare.apply_lighting - both inside the single
  #     `if allow_turn_on` block in default: below.
  #   flare.apply_lighting for IDLE BRIGHTNESS - called from TWO places
  #     (the motion_off branch and default:), gated instead on
  #     idle_entities being non-empty AND occupancy_clear_for_wait.
  #
  # Nothing else in action: writes an "on" state. Anything added later
  # that can switch a light on needs one of those two gates.
  #
  # The idle gate must stay NARROWER than allow_turn_on, not become a
  # new way for it to be true - widening allow_turn_on itself would let
  # the CURVE light an empty room. It also must not be gated on
  # `occupied`: an idle light being on would make the room read as
  # occupied, and the curve would ramp the nightlight back up to full.
  allow_turn_on: >
    {{ manual_run
       or (trigger is defined and trigger.id is defined and trigger.id == 'motion_on')
       or occupied }}
  # Used by self-heal below to retry turning off anything still on -
  # excludes hands_off_entities (not ours to touch) and idle_entities
  # (deliberately on; self-heal would otherwise retry turning it off
  # every tick, fighting the branch that just turned it on).
  entities_still_on: >
    {{ resolved_entities | select('is_state', 'on')
       | reject('in', hands_off_entities) | reject('in', idle_entities) | list }}
  # Same as resolved_entities, widened to every entity on each light's
  # device - lets scene-compatibility checking below account for
  # siblings, e.g. a light strip's effect selector.
  scope_entities: >
    {% set ns = namespace(entities=target_expanded_entities) %}
    {% for e in (target_named_entities | select('match', '^light\\.') | list) %}
      {% set did = device_id(e) %}
      {% set ns.entities = ns.entities + (device_entities(did) if did else [e]) %}
    {% endfor %}
    {{ ns.entities | unique | list }}
  morning_scene: !input morning_scene
  day_scene: !input day_scene
  evening_scene: !input evening_scene
  night_scene: !input night_scene
  phase_scene: >
    {% set m = {'Morning': morning_scene, 'Day': day_scene, 'Evening': evening_scene, 'Night': night_scene} %}
    {{ m.get(phase) }}
  # scene_template wins whenever it returns something valid (it can react
  # to things a phase alone can't, e.g. "if the TV is on"); the per-phase
  # pick is the fallback. A typo or a renamed/removed scene is treated as
  # returning nothing rather than erroring.
  #
  # candidate must pass an entity_id shape check before reaching
  # states[candidate]: states[] raises a hard TemplateError - not "not
  # found" - on a string that isn't even entity_id-shaped, aborting the
  # whole variables: block before condition:/action: run. phase_scene
  # needs no such guard; it comes from a domain: scene selector.
  desired_scene: >
    {% set candidate = (scene_template | trim) %}
    {% if candidate and candidate is match('^[a-z0-9_]+\\.[a-z0-9_]+$') and states[candidate] is not none %}
      {{ candidate }}
    {% elif phase_scene and states[phase_scene] is not none %}
      {{ phase_scene }}
    {% else %}
      {{ '' }}
    {% endif %}
  scene_covered_entities: >
    {% if desired_scene | length > 0 %}
      {{ state_attr(desired_scene, 'entity_id') | default([], true) | list }}
    {% else %}
      {{ [] }}
    {% endif %}
  # The scene only counts as usable if every entity it covers is within our scope
  scene_valid: "{{ scene_covered_entities | reject('in', scope_entities) | list | length == 0 }}"
  scene_active: "{{ desired_scene | length > 0 and scene_valid }}"
  # Lights this tick has deliberately handed off - to an active scene,
  # or to whatever owns them via a null/false level. apply_lighting
  # never writes these, so their claims would freeze and read as
  # "overridden"; the action step below releases them instead.
  #
  # scene_active gates the scene half: a scene reaching outside scope
  # has entities here while adaptive still manages them, and releasing
  # those would be wrong.
  handed_off_entities: >
    {{ ((scene_covered_entities if scene_active else []) + hands_off_entities) | unique | list }}
  # Whether "Activate matching scene" below should call scene.turn_on
  # again this tick. Scenes carry none of apply_lighting's tolerance/
  # override protection, so re-issuing every minute would stomp a
  # manual change to one of the scene's own lights.
  #
  # Only a `phase_change` whose phase didn't actually change is
  # skipped; the periodic floor tick is excluded outright since it has
  # no from_state/to_state to compare (reading them would abort the run).
  scene_recheck_due: >
    {% if trigger is defined and trigger.id is defined and trigger.id == 'tick' %}
      false
    {% else %}
      {{ not (trigger is defined and trigger.id is defined and trigger.id == 'phase_change')
         or trigger.from_state is none
         or trigger.to_state is none
         or trigger.from_state.state != trigger.to_state.state }}
    {% endif %}
  # Lights the adaptive brightness/colour logic below should manage -
  # everything except what an active scene already covers.
  #
  # No allow_turn_on filtering here: the apply_lighting step already
  # sits inside default:'s single `if allow_turn_on` block, so this list
  # is only ever used when switching a light on is already permitted.
  # Don't re-add a per-entity `reject('is_state', 'off')` filter here -
  # it's redundant with that gate, not a second layer of protection.
  target_entities: >
    {{ resolved_entities | reject('in', scene_covered_entities) | list if scene_active else resolved_entities }}
action:
  - choose:
      # Motion timed out: turn everything reachable off, but only if
      # occupancy is clear in aggregate - occupancy.cleared fires the
      # instant ANY one sensor goes off, even while another still
      # reports occupied. If another sensor is still on, these
      # conditions fail and default: reapplies lighting instead (a
      # no-op if the light is already correct).
      - alias: "Motion timed out and the room is confirmed empty"
        conditions:
          - condition: trigger
            alias: "Triggered by motion_off"
            id: motion_off
          - alias: "No occupancy sensor still reports the room in use"
            not:
              - condition: occupancy.is_detected
                alias: "Room occupancy currently detected"
                target: !input room_target
        sequence:
          - alias: "Turn off the light(s)"
            action: light.turn_off
            target:
              entity_id: "{{ turn_off_entities }}"
            data:
              transition: !input motion_off_transition
          # Idle-brightness lights are dimmed instead of switched off.
          # Can switch a light ON, hence gated on idle_entities - a room
          # with no idle brightness configured reaches an empty list
          # and this step does nothing.
          - alias: "Leave the idle-brightness lights dimly lit"
            if:
              - condition: template
                alias: "Room has idle-brightness lights to dim"
                value_template: "{{ idle_entities | length > 0 }}"
            then:
              - action: flare.apply_lighting
                data:
                  entities: "{{ idle_entities }}"
                  brightness_multipliers: "{{ idle_multipliers }}"
                  brightness: 255
                  color_temp_kelvin: "{{ color_temp_kelvin }}"
                  rgb_color: "{{ rgb_color }}"
                  transition: !input motion_off_transition
                  prefer_rgb_color: "{{ prefer_rgb_color }}"
                  tracking_device_id: "{{ tracking_scope_device_id }}"
          - alias: "Record the turn-off as ours"
            # Without this the integration reads this turn-off as
            # someone else's, since it has no claim for the context.
            # Skipped with no resolvable scope - nothing is tracking
            # these lights, and claims_record requires a scope.
            if:
              - condition: template
                alias: "There's a scope and lights to record the turn-off against"
                value_template: >-
                  {{ tracking_scope_device_id is not none
                     and turn_off_entities | length > 0 }}
            then:
              - action: flare.claims_record
                data:
                  entities: "{{ turn_off_entities }}"
                  tracking_device_id: "{{ tracking_scope_device_id }}"
                  # dict(a, **b) rather than dict.fromkeys: the same
                  # construct used for the brightness levels below,
                  # and known to work in HA's Jinja.
                  targets: >-
                    {% set ns = namespace(t={}) %}
                    {% for e in turn_off_entities %}
                      {% set ns.t = dict(ns.t, **{e: {'state': 'off'}}) %}
                    {% endfor %}
                    {{ ns.t }}
      # Self-healing: on the periodic tick, if the room is unoccupied but
      # something is still on (an earlier turn-off didn't land), retry
      # just that. Exclusive of default: rather than doing both -
      # entities_still_on is computed once in variables:, before
      # action: runs, so reapplying in the same run risks turning the
      # just-turned-off light straight back on. The next tick resumes.
      - alias: "Self-heal: retry an earlier turn-off that didn't land"
        conditions:
          # phase_change too, not just the tick: leaving a phase whose
          # idle brightness was set for one whose isn't empties
          # idle_entities, so the room's lights are still ON but no
          # longer read as idle - which would otherwise ramp them to
          # full on the very next default: tick instead of turning off.
          - condition: trigger
            alias: "Triggered by the periodic tick or a phase change"
            id:
              - tick
              - phase_change
          # No occupancy sensor means nothing to reconcile against.
          - condition: template
            alias: "Room has an occupancy sensor to reconcile against"
            value_template: "{{ room_occupancy_entities | length > 0 }}"
          # Continuously clear for the full Wait time, not just clear
          # right now - a bare "not occupancy.is_detected" would let a
          # momentary sensor blip turn lights off. Hand-written rather
          # than occupancy.is_not_detected's native `for:`, which needs
          # the recorder to prime a duration already satisfied before
          # it started watching - not reliable right after a restart.
          - condition: template
            alias: "Occupancy has been clear for the full Wait time"
            value_template: "{{ occupancy_clear_for_wait }}"
          - condition: template
            alias: "Something in the room is still on"
            value_template: "{{ entities_still_on | length > 0 }}"
        sequence:
          - alias: "Self-heal: retry turning off lights left on with no occupancy"
            action: light.turn_off
            target:
              entity_id: "{{ entities_still_on }}"
            data:
              transition: !input motion_off_transition
          - alias: "Record the turn-off as ours"
            # Same reasoning as the motion_off branch's copy of this
            # step above.
            if:
              - condition: template
                alias: "There's a scope to record the turn-off against"
                value_template: "{{ tracking_scope_device_id is not none }}"
            then:
              - action: flare.claims_record
                data:
                  entities: "{{ entities_still_on }}"
                  tracking_device_id: "{{ tracking_scope_device_id }}"
                  targets: >-
                    {% set ns = namespace(t={}) %}
                    {% for e in entities_still_on %}
                      {% set ns.t = dict(ns.t, **{e: {'state': 'off'}}) %}
                    {% endfor %}
                    {{ ns.t }}
    default:
      # Everything that can switch a light ON lives under this one gate -
      # see allow_turn_on's own comment in variables: for the invariant.
      # scene.turn_on is all-or-nothing over its own entities and can't
      # be filtered per-light, so the gate has to decide whether the
      # step runs at all, same as apply_lighting.
      #
      # An empty room settles to its idle brightness instead of staying
      # dark - deliberately OUTSIDE the allow_turn_on gate (see the
      # STRUCTURAL INVARIANT comment in variables:). Doesn't fight
      # motion: a motion_on tick has occupancy detected, so this is
      # false and the curve applies at full brightness instead.
      #
      # room_occupancy_entities is checked because occupancy.is_detected
      # is vacuously FALSE with no occupancy sensors, which would
      # otherwise leave a sensor-less room at the idle level forever.
      - alias: "Settle an empty room to its idle brightness"
        if:
          - condition: template
            alias: "Room is idle, and the sensor has a colour target"
            value_template: "{{ room_is_idle and color_temp_kelvin is not none }}"
        then:
          - alias: "Apply idle brightness (FLARE)"
            action: flare.apply_lighting
            data:
              entities: "{{ idle_entities }}"
              brightness_multipliers: "{{ idle_multipliers }}"
              brightness: 255
              color_temp_kelvin: "{{ color_temp_kelvin }}"
              rgb_color: "{{ rgb_color }}"
              transition: "{{ script_transition }}"
              prefer_rgb_color: "{{ prefer_rgb_color }}"
              tracking_device_id: "{{ tracking_scope_device_id }}"
      - alias: "Only motion, a manual run, or a room already in use may switch a light on"
        if:
          - condition: template
            alias: "Allowed to turn on, and not already handled by the idle nightlight"
            # `not room_is_idle` is what stops the nightlight ramping
            # itself back up: an idle light being on makes the room read
            # as occupied, which would otherwise satisfy allow_turn_on
            # and hand the room straight back to the curve.
            value_template: "{{ allow_turn_on and not room_is_idle }}"
        then:
          - alias: "Activate a scene, if one applies and is due a recheck"
            if:
              - condition: template
                alias: "A scene applies and is due a recheck"
                value_template: "{{ scene_active and scene_recheck_due }}"
            then:
              - alias: "Activate matching scene"
                action: scene.turn_on
                target:
                  entity_id: "{{ desired_scene }}"
                data:
                  transition: "{{ script_transition }}"
          # Reachability, multiplier bucketing, tolerance checks, override
          # protection, two-step/combined routing and RGB-vs-colour-temp
          # dispatch all live in the FLARE integration, not here.
          #
          # Guarded because brightness/color_temp_kelvin are plain
          # state_attr() reads - an unavailable or renamed sensor entity
          # renders them null, and apply_lighting requires both. Guards
          # this one step rather than condition:, since motion_off and
          # self-heal turn lights *off* and need nothing from the sensor.
          - alias: "Apply adaptive lighting, unless the sensor has no target to apply"
            if:
              - condition: template
                alias: "Sensor has a real brightness and colour target"
                value_template: "{{ brightness is not none and color_temp_kelvin is not none }}"
            then:
              - alias: "Apply adaptive lighting (FLARE)"
                action: flare.apply_lighting
                data:
                  entities: "{{ target_entities }}"
                  brightness_multipliers: "{{ brightness_multipliers }}"
                  brightness: 255
                  color_temp_kelvin: "{{ color_temp_kelvin }}"
                  rgb_color: "{{ rgb_color }}"
                  transition: "{{ script_transition }}"
                  prefer_rgb_color: "{{ prefer_rgb_color }}"
                  tracking_device_id: "{{ tracking_scope_device_id }}"
                  # A manual run (someone hit "Run" on this automation, or
                  # called automation.trigger directly) forces the whole tick
                  # through regardless of override protection.
                  force: "{{ manual_run }}"
      # Bookkeeping only - changes no light, so it stays outside the gate
      # above and runs on every tick reaching default:, dark room
      # included: "nothing is managing these lights" is still true.
      #
      # Nothing is given up by releasing - these lights aren't being
      # written, so there's no protection to lose, and the next tick
      # that does manage them re-establishes a claim normally.
      # claims_clear is a no-op with no record, so this costs nothing
      # when nothing changes - but it now requires a scope, so the
      # condition also guards on one resolving at all.
      - alias: "Release lights handed off to a scene or another owner"
        if:
          - condition: template
            alias: "There are lights to release, and a scope to release them from"
            value_template: >-
              {{ handed_off_entities | length > 0 and tracking_scope_device_id is not none }}
        then:
          - action: flare.claims_clear
            data:
              entities: "{{ handed_off_entities }}"
              tracking_device_id: "{{ tracking_scope_device_id }}"
