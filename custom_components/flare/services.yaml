compute_lighting_groups:
  name: Compute lighting groups
  description: >-
    Returns the commands apply_lighting would send, without sending them.
    Lights are grouped by brightness, with two-step and RGB lights listed
    separately. Unavailable lights, lights already close to the target and
    overridden lights are left out.
  fields:
    entities:
      name: Entities
      description: Light entities to consider.
      required: true
      selector:
        entity:
          multiple: true
          domain: light
    brightness_levels:
      name: Brightness levels
      description: >-
        Map of entity ID to the brightness (0-255) for that light, in place of
        Target brightness. 0 turns the light off, and null or false leaves the
        light alone.
      example: '{"light.lamp": 120, "light.strip": 0}'
      selector:
        object:
    brightness:
      name: Target brightness
      description: >-
        Brightness (0-255) for every light that isn't in Brightness levels,
        where 0 turns them off. Required unless every light has a level.
      selector:
        number:
          min: 0
          max: 255
    color_temp_kelvin:
      name: Target colour temperature
      description: Target colour temperature in Kelvin.
      required: true
      selector:
        number:
          min: 1000
          max: 10000
          unit_of_measurement: K
    brightness_tolerance:
      name: Brightness tolerance
      description: >-
        A light within this much of the target brightness (0-255) isn't sent
        anything.
      default: 2
      selector:
        number:
          min: 0
          max: 50
    color_temp_tolerance:
      name: Colour temperature tolerance
      description: >-
        A light within this many Kelvin of the target isn't sent anything.
        Values that convert to the same mired always count as a match.
      default: 10
      selector:
        number:
          min: 0
          max: 500
          unit_of_measurement: K
    two_step_label:
      name: Two-step label
      description: >-
        Lights or devices with this label are listed under two_step, for bulbs
        that can't change brightness and colour temperature in one command.
        Lights matching the two-step models under FLARE → Zones → Configure are
        listed there too.
      default: no_combined_transition
      selector:
        text:
    prefer_rgb_color:
      name: Prefer RGB colour
      description: >-
        Lights that support RGB are listed under combined_rgb or two_step_rgb,
        targeting rgb_color instead of color_temp_kelvin. Needs rgb_color.
      default: false
      selector:
        boolean:
    rgb_color:
      name: Target RGB colour
      description: >-
        The colour for RGB lights when Prefer RGB colour is on, usually the
        colour temperature as RGB (the rgb_color from the schedule sensor or
        compute_curve). Can be null.
      selector:
        color_rgb:
    rgb_color_tolerance:
      name: RGB colour tolerance
      description: >-
        A light within this much of rgb_color on each channel (0-255) isn't
        sent anything.
      default: 10
      selector:
        number:
          min: 0
          max: 100
    min_brightness_change:
      name: Minimum brightness change
      description: >-
        A light within this percentage of the target brightness isn't sent
        anything, though the limit is never smaller than Brightness tolerance.
        Leave unset to use the setting under FLARE → Zones → Configure.
      selector:
        number:
          min: 0
          max: 25
          step: 0.5
          unit_of_measurement: "%"
    min_color_temp_change:
      name: Minimum colour temperature change
      description: >-
        A light within this many mireds of the target colour temperature isn't
        sent anything. Leave unset to use the setting under FLARE → Zones →
        Configure.
      selector:
        number:
          min: 0
          max: 50
          step: 0.5
          unit_of_measurement: mired
    force:
      name: Force
      description: >-
        Sets every light, including overridden ones. The change is still
        recorded, so later calls treat it as FLARE's.
      default: false
      selector:
        boolean:
    zone_device_id:
      name: Zone
      description: >-
        The zone whose claims decide which lights are overridden. Leave unset
        to treat no light as overridden.
      selector:
        device:
          filter:
            - integration: flare
              model: Zone

apply_lighting:
  name: Apply lighting
  description: >-
    Sets lights to a brightness and colour temperature, turning on any that
    are off. Skips lights that are unavailable, already close to the target,
    or overridden. Bulbs that need it are sent brightness and colour
    temperature as two commands.
  fields:
    entities:
      name: Entities
      description: Light entities to consider.
      required: true
      selector:
        entity:
          multiple: true
          domain: light
    brightness_levels:
      name: Brightness levels
      description: >-
        Map of entity ID to the brightness (0-255) for that light, in place of
        Target brightness. 0 turns the light off, and null or false leaves the
        light alone.
      example: '{"light.lamp": 120, "light.strip": 0}'
      selector:
        object:
    brightness:
      name: Target brightness
      description: >-
        Brightness (0-255) for every light that isn't in Brightness levels,
        where 0 turns them off. Required unless every light has a level.
      selector:
        number:
          min: 0
          max: 255
    color_temp_kelvin:
      name: Target colour temperature
      description: Target colour temperature in Kelvin.
      required: true
      selector:
        number:
          min: 1000
          max: 10000
          unit_of_measurement: K
    transition:
      name: Transition
      description: >-
        Transition in seconds. Two-step bulbs take half for brightness, then
        half for colour temperature.
      required: true
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: s
    brightness_tolerance:
      name: Brightness tolerance
      description: >-
        A light within this much of the target brightness (0-255) isn't sent
        anything.
      default: 2
      selector:
        number:
          min: 0
          max: 50
    color_temp_tolerance:
      name: Colour temperature tolerance
      description: >-
        A light within this many Kelvin of the target isn't sent anything.
        Values that convert to the same mired always count as a match.
      default: 10
      selector:
        number:
          min: 0
          max: 500
          unit_of_measurement: K
    two_step_label:
      name: Two-step label
      description: >-
        Lights or devices with this label are sent brightness and colour
        temperature as two commands, for bulbs that can't change both in one.
        So are lights matching the two-step models under FLARE → Zones →
        Configure.
      default: no_combined_transition
      selector:
        text:
    prefer_rgb_color:
      name: Prefer RGB colour
      description: >-
        Lights that support RGB are sent rgb_color instead of
        color_temp_kelvin. Needs rgb_color.
      default: false
      selector:
        boolean:
    rgb_color:
      name: Target RGB colour
      description: >-
        The colour for RGB lights when Prefer RGB colour is on, usually the
        colour temperature as RGB (the rgb_color from the schedule sensor or
        compute_curve). Can be null.
      selector:
        color_rgb:
    rgb_color_tolerance:
      name: RGB colour tolerance
      description: >-
        A light within this much of rgb_color on each channel (0-255) isn't
        sent anything.
      default: 10
      selector:
        number:
          min: 0
          max: 100
    min_brightness_change:
      name: Minimum brightness change
      description: >-
        A light within this percentage of the target brightness isn't sent
        anything, though the limit is never smaller than Brightness tolerance.
        Leave unset to use the setting under FLARE → Zones → Configure.
      selector:
        number:
          min: 0
          max: 25
          step: 0.5
          unit_of_measurement: "%"
    min_color_temp_change:
      name: Minimum colour temperature change
      description: >-
        A light within this many mireds of the target colour temperature isn't
        sent anything. Leave unset to use the setting under FLARE → Zones →
        Configure.
      selector:
        number:
          min: 0
          max: 50
          step: 0.5
          unit_of_measurement: mired
    force:
      name: Force
      description: >-
        Sets every light, including overridden ones. The change is still
        recorded, so later calls treat it as FLARE's.
      default: false
      selector:
        boolean:
    zone_device_id:
      name: Zone
      description: >-
        The zone to record this change in. Leave unset to set the lights
        without recording anything, so no light is treated as overridden.
      selector:
        device:
          filter:
            - integration: flare
              model: Zone

turn_off:
  name: Turn off lights
  description: >-
    Turns lights off and records it, so FLARE doesn't treat them as
    overridden. It turns off every light it's given, including overridden
    ones.
  fields:
    entities:
      name: Entities
      description: Lights to turn off.
      required: true
      selector:
        entity:
          domain: light
          multiple: true
    transition:
      name: Transition
      description: >-
        Transition in seconds.
      default: 0
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: s
    zone_device_id:
      name: Zone
      description: >-
        The zone to record this in. Leave unset to turn the lights off without
        recording anything.
      selector:
        device:
          filter:
            - integration: flare
              model: Zone

compute_curve:
  name: Compute curve
  description: >-
    Returns the phase, brightness, colour temperature and RGB colour at a
    moment, for the phase start times given. Any curve setting left out takes
    the value a new schedule starts with.
  fields:
    morning:
      name: Morning boundary
      description: Unix timestamp when the Morning phase starts today.
      required: true
      selector:
        number:
    day:
      name: Day boundary
      description: Unix timestamp when the Day phase starts today.
      required: true
      selector:
        number:
    evening:
      name: Evening boundary
      description: Unix timestamp when the Evening phase starts today.
      required: true
      selector:
        number:
    night:
      name: Night boundary
      description: Unix timestamp when the Night phase starts today.
      required: true
      selector:
        number:
    at:
      name: At
      description: >-
        The moment to evaluate, as a Unix timestamp. Defaults to now.
      selector:
        number:
    morning_brightness:
      name: Morning brightness
      description: >-
        Brightness (0-255) for Morning.
      default: 255
      selector:
        number:
          min: 0
          max: 255
    morning_kelvin:
      name: Morning colour temperature
      description: >-
        Colour temperature (Kelvin) for Morning.
      default: 6667
      selector:
        number:
          min: 1000
          max: 10000
          unit_of_measurement: K
    day_brightness:
      name: Day brightness
      description: >-
        Brightness (0-255) for Day.
      default: 255
      selector:
        number:
          min: 0
          max: 255
    day_kelvin:
      name: Day colour temperature
      description: >-
        Colour temperature (Kelvin) for Day. With the default transition, Day
        eases from this to Evening's across the whole phase.
      default: 6667
      selector:
        number:
          min: 1000
          max: 10000
          unit_of_measurement: K
    evening_brightness:
      name: Evening brightness
      description: >-
        Brightness (0-255) for Evening.
      default: 180
      selector:
        number:
          min: 0
          max: 255
    evening_kelvin:
      name: Evening colour temperature
      description: >-
        Colour temperature (Kelvin) for Evening.
      default: 3200
      selector:
        number:
          min: 1000
          max: 10000
          unit_of_measurement: K
    night_brightness:
      name: Night brightness
      description: >-
        Brightness (0-255) for Night.
      default: 80
      selector:
        number:
          min: 0
          max: 255
    night_kelvin:
      name: Night colour temperature
      description: >-
        Colour temperature (Kelvin) for Night.
      default: 2700
      selector:
        number:
          min: 1000
          max: 10000
          unit_of_measurement: K
    morning_brightness_transition:
      name: Morning brightness transition
      description: >-
        Minutes before Morning ends to start easing brightness to the next
        phase's. 0 changes at the boundary, and a value longer than Morning
        eases across the whole phase.
      default: 60
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
    morning_kelvin_transition:
      name: Morning colour transition
      description: >-
        Minutes before Morning ends to start easing colour temperature to the
        next phase's. 0 changes at the boundary, and a value longer than
        Morning eases across the whole phase.
      default: 60
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
    day_brightness_transition:
      name: Day brightness transition
      description: >-
        Minutes before Day ends to start easing brightness to the next
        phase's. 0 changes at the boundary, and a value longer than Day eases
        across the whole phase.
      default: 65
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
    day_kelvin_transition:
      name: Day colour transition
      description: >-
        Minutes before Day ends to start easing colour temperature to the next
        phase's. 0 changes at the boundary, and a value longer than Day eases
        across the whole phase.
      default: 1440
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
    evening_brightness_transition:
      name: Evening brightness transition
      description: >-
        Minutes before Evening ends to start easing brightness to the next
        phase's. 0 changes at the boundary, and a value longer than Evening
        eases across the whole phase.
      default: 60
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
    evening_kelvin_transition:
      name: Evening colour transition
      description: >-
        Minutes before Evening ends to start easing colour temperature to the
        next phase's. 0 changes at the boundary, and a value longer than
        Evening eases across the whole phase.
      default: 60
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
    night_brightness_transition:
      name: Night brightness transition
      description: >-
        Minutes before Night ends to start easing brightness to the next
        phase's. 0 changes at the boundary, and a value longer than Night
        eases across the whole phase.
      default: 30
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
    night_kelvin_transition:
      name: Night colour transition
      description: >-
        Minutes before Night ends to start easing colour temperature to the
        next phase's. 0 changes at the boundary, and a value longer than Night
        eases across the whole phase.
      default: 30
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min

compute_scene_coverage:
  name: Compute scene coverage
  description: >-
    Returns which of target_entities a scene sets (covered_entities) and which
    it doesn't (uncovered_entities). If the scene doesn't exist, or sets an
    entity outside scope_entities, scene_valid is false and every target
    entity is uncovered.
  fields:
    scene_entity_id:
      name: Scene
      description: >-
        The scene to check.
      required: true
      selector:
        entity:
          domain: scene
    scope_entities:
      name: Scope entities
      description: >-
        Every entity the scene may set, usually the lights you control plus
        other entities on the same devices.
      required: true
      selector:
        entity:
          multiple: true
    target_entities:
      name: Target entities
      description: >-
        The entities to check.
      required: true
      selector:
        entity:
          multiple: true

resolve_target:
  name: Resolve target
  description: >-
    Returns the entities a target reaches, in the response's entities field,
    chosen as Home Assistant chooses them for an action: entities named
    directly always, and through a device, area, floor or label only if they
    aren't hidden. Config and diagnostic entities are skipped too, except
    those a label names directly. Changes nothing.
  target: {}

claims_check:
  name: Check claims
  description: >-
    Reports whether FLARE would leave each entity alone, using the zone's
    claims. Changes nothing. Call claims_record before you change an entity,
    so a later check treats the change as FLARE's.
  fields:
    entities:
      name: Entities
      description: >-
        Entities to check, of any domain.
      required: true
      selector:
        entity:
          multiple: true
    zone_device_id:
      name: Zone
      description: >-
        The zone whose claims to check.
      required: true
      selector:
        device:
          filter:
            - integration: flare
              model: Zone
    brightness_tolerance:
      name: Brightness tolerance
      description: >-
        A light within this much (0-255) of a recorded brightness matches it.
      default: 2
      selector:
        number:
          min: 0
          max: 50
    color_temp_tolerance:
      name: Colour temperature tolerance
      description: >-
        A light within this many Kelvin of a recorded colour temperature
        matches it. Values that convert to the same mired always match.
      default: 10
      selector:
        number:
          min: 0
          max: 500
          unit_of_measurement: K
    rgb_color_tolerance:
      name: RGB colour tolerance
      description: >-
        A light within this much of a recorded RGB colour on each channel
        (0-255) matches it.
      default: 10
      selector:
        number:
          min: 0
          max: 100

claims_record:
  name: Record claims
  description: >-
    Records a claim, so a later claims_check treats your change as FLARE's.
    Call it just before you change the entities.
  fields:
    entities:
      name: Entities
      description: >-
        Entities you're about to change.
      required: true
      selector:
        entity:
          multiple: true
    zone_device_id:
      name: Zone
      description: >-
        The zone to record the claim in.
      required: true
      selector:
        device:
          filter:
            - integration: flare
              model: Zone
    targets:
      name: Targets
      description: >-
        Map of entity ID to the values you're about to send: {"brightness":
        ..., "color_temp_kelvin": ...} or {"brightness": ..., "rgb_color":
        [...]}. Without it, a light that's slow to report back is treated as
        overridden.
      example: '{"light.lamp": {"brightness": 200, "color_temp_kelvin": 3000}}'
      selector:
        object:

claims_clear:
  name: Clear claims
  description: >-
    Discards claims, so FLARE sets the entities again on its next update. For
    a light stuck as overridden in a room that's never fully dark.
  fields:
    entities:
      name: Entities
      description: >-
        Entities to clear, of any domain.
      required: true
      selector:
        entity:
          multiple: true
    zone_device_id:
      name: Zone
      description: >-
        The zone to clear them from.
      required: true
      selector:
        device:
          filter:
            - integration: flare
              model: Zone

claims_override:
  name: Override claims
  description: >-
    Marks entities as changed by someone else, so FLARE leaves them alone until
    the zone goes dark, their claims are cleared, or a forced write takes them
    back. Usually unnecessary, since FLARE notices changes to lights it's
    driving; it's for lights it isn't driving yet, such as ones your automation
    turns on in a dark room.
  fields:
    entities:
      name: Entities
      description: >-
        Entities to mark, of any domain.
      required: true
      selector:
        entity:
          multiple: true
    zone_device_id:
      name: Zone
      description: >-
        The zone to mark them in.
      required: true
      selector:
        device:
          filter:
            - integration: flare
              model: Zone

export_schedule:
  name: Export schedule
  description: >-
    Returns a schedule's settings as YAML, keyed by phase, in the response's
    schedule field.
  fields:
    schedule_device_id:
      name: Schedule
      description: The FLARE schedule to export.
      required: true
      selector:
        device:
          filter:
            - integration: flare
              model: Schedule

import_schedule:
  name: Import schedule
  description: >-
    Sets a schedule from YAML in the format export_schedule returns. Settings
    left out keep their current values. A schedule with an error in it changes
    nothing.
  fields:
    schedule_device_id:
      name: Schedule
      description: The FLARE schedule to set.
      required: true
      selector:
        device:
          filter:
            - integration: flare
              model: Schedule
    schedule:
      name: Schedule
      description: >-
        The schedule, keyed by phase (morning, day, evening, night). Each
        phase takes brightness, kelvin, brightness_transition and
        kelvin_transition, plus a start time (time) or, for evening, the
        earliest and latest times around sunset.
      required: true
      example: |
        morning:
          time: "06:30"
          brightness: 255
        night:
          kelvin: 2000
      selector:
        text:
          multiline: true
