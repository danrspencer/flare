templates:
  source: 29564ae0
  name: Eigene
  description: >-
    Vorlagen für alles, was die Einstellungen je Phase nicht können, etwa den
    Raum zu dimmen, während der Fernseher läuft. Was eine Vorlage setzt,
    ersetzt die Einstellung der Phase.

brightness_template:
  source: 8d318e69
  name: Helligkeitsvorlage
  description: >-
    Liefert die Helligkeit (0–255) jeder Lampe anstelle der des Zeitplans: {{
    {'light.lamp': 50} }}. 0 schaltet eine Lampe aus; null lässt sie in Ruhe.
    Für Lampen, die sie nennt, gilt „Lampen aus“ nicht.
    [Details](https://danrspencer.github.io/flare/reference/blueprint/#brightness-template).

idle_brightness_template:
  source: 6f0f8e16
  name: Ruhehelligkeitsvorlage
  description: >-
    Liefert die Helligkeit (1–255), auf die jede Lampe dimmt, wenn der Raum
    leer ist: {{ {'light.lamp': 10} }}. Für Lampen, die sie nennt, gilt
    „Ruhehelligkeit“ nicht. Funktioniert nur in Räumen mit Anwesenheits- oder
    Bewegungssensoren.
    [Details](https://danrspencer.github.io/flare/reference/blueprint/#idle-brightness).

scene_template:
  source: 522f81af
  name: Szenenvorlage
  description: >-
    Liefert eine Szene, die statt des Zeitplans gilt, oder nichts, um normal
    weiterzumachen. Liefert sie eine, hat sie Vorrang vor der Szene der Phase.
    [Details](https://danrspencer.github.io/flare/reference/blueprint/#scenes).

additional_triggers:
  source: 5dd01ff2
  name: Zusätzliche Auslöser
  description: >-
    Aktualisiert den Raum sofort, wenn einer davon auslöst, etwa wenn der
    Fernseher zu spielen beginnt oder sich eine Entität ändert, die eine
    Vorlage liest. Sie passen nur Lampen an, die schon an sind.
    [Details](https://danrspencer.github.io/flare/reference/blueprint/#additional-triggers).

advanced_divider:
  source: 24d8fc9c
  name: Feinabstimmung
  description: >-
    Wann der Raum reagiert, und wie. Die Standardwerte passen für die meisten
    Räume.

sensors:
  source: 2bbd93a5
  name: Sensoren & Bedingungen

no_motion_wait:
  source: 28b0f2e0
  name: Wartezeit
  description: >-
    Wie lange jeder Anwesenheits- und Bewegungssensor frei sein muss, bevor
    der Raum als leer gilt und seine Lampen ausgehen.
    [Details](https://danrspencer.github.io/flare/reference/blueprint/#wait-time).
  unit: Sekunden

lux_threshold:
  source: 8fbfce09
  name: Lux-Schwelle
  description: >-
    Misst jeder Helligkeitssensor mehr als so viele Lux, bleibt der Raum
    dunkel. Ist noch jemand da, wenn es dunkler wird, gehen die Lampen dann
    an. Den Raum von Hand einzuschalten funktioniert weiterhin. 0 schaltet
    dies ab.
    [Details](https://danrspencer.github.io/flare/reference/blueprint/#lux-threshold).
  unit: lx

conditions:
  source: ce8aab53
  name: Bedingungen
  description: >-
    Sind welche gesetzt, aktualisiert sich der Raum nur, solange alle
    zutreffen. Den Rest der Zeit ist er pausiert und lässt die Lampen in Ruhe.
    [Details](https://danrspencer.github.io/flare/reference/blueprint/#conditions).

timing:
  source: 90775e3b
  name: Übergänge

motion_on_transition:
  source: 7b0919b3
  name: Einschalten
  description: >-
    Wie lange Lampen zum Aufhellen brauchen, wenn jemand kommt oder der Raum
    eingeschaltet wird.
  unit: Sekunden

motion_off_transition:
  source: fefbb7c4
  name: Ausschalten
  description: Wie lange Lampen zum Ausblenden brauchen, sobald der Raum leer ist.
  unit: Sekunden

background_transition:
  source: 2f6f942d
  name: Alles andere
  description: >-
    Wie lange andere Änderungen zum Einblenden brauchen, etwa wenn der
    Zeitplan weitergeht oder sich eine Vorlage ändert. Darauf wartet niemand.
  unit: Sekunden

settings:
  source: 27d38298
  name: Weitere Einstellungen

override_protection:
  source: 85e6124a
  name: Schutz vor Überschreiben
  description: >-
    Lässt eine Lampe in Ruhe, sobald etwas anderes sie ändert, bis alle Lampen
    des Raums aus sind. Schalte dies für einen Raum ab, dessen Lampen etwas
    anderes melden, als sie zeigen.
    [Details](https://danrspencer.github.io/flare/reference/blueprint/#override-protection).

rgb_phases:
  source: 86b67f46
  name: RGB bevorzugen während
  description: >-
    Phasen, in denen Lampen, die es können, RGB-Farbe statt Farbtemperatur
    bekommen. Kühles Weiß kann in RGB bläulich wirken, daher sind Morgen und
    Tag standardmäßig aus.
    [Details](https://danrspencer.github.io/flare/reference/blueprint/#prefer-rgb-during).
  options:
    Morning: Morgen
    Day: Tag
    Evening: Abend
    Night: Nacht

stored_traces:
  source: df8e4c32
  name: Gespeicherte Traces
  description: >-
    Wie viele der letzten Läufe der Automation einen Trace behalten. Der Raum
    aktualisiert sich jede Minute, das ist also ungefähr, wie viele Minuten du
    zurückschauen kannst.
    [Details](https://danrspencer.github.io/flare/reference/blueprint/#stored-traces).

use_area_sensors:
  source: 65f77069
  name: Sensoren aus Bereichen (veraltet)
  description: >-
    Veraltet und wird in FLARE 3.0 als Option entfernt: nutze „Ziel ausnehmen“
    in „Lampen & Anwesenheit“, statt dies abzuschalten. Nur sichtbar, solange
    es aus ist.
    [Details](https://danrspencer.github.io/flare/reference/blueprint/#sensors-from-areas).

extra_triggers:
  source: d4804085
  name: Zusätzliche Auslöser-Entitäten (veraltet)
  description: >-
    Veraltet und wird in FLARE 3.0 als Option entfernt: füge stattdessen einen
    Zustandsauslöser zu „Zusätzliche Auslöser“ hinzu. Entitäten, bei deren
    Änderung der Raum sofort aktualisiert wird.
    [Details](https://danrspencer.github.io/flare/reference/blueprint/#additional-trigger-entities).
