night_phase:
  source: 519d00a9
  name: Nacht

night_exclude_lights:
  source: 28ad28ee
  name: Lampen aus
  description: Lampen im Raum, die in der Nacht aus bleiben.

night_idle_brightness:
  source: 51c953ac
  name: Ruhehelligkeit
  description: >-
