# The FLARE blueprint's text in German, by input key (blueprint_translation.py).
# `source` is a hash of the English each entry was translated from; when the
# English changes, tests/checks/test_blueprint_translations.py names the
# entries to revisit and their new hash.


blueprint:
  source: 8098d45a
  description: >-
    FLARE: phasenbasiertes zirkadianes Licht – setzt Helligkeit und
    Farbtemperatur nach einem FLARE-Zeitplan, hält die Lampen aktuell, wenn er
    sich ändert, und schaltet sie eine Weile, nachdem niemand mehr da ist,
    aus. Alle Details zu jeder Eingabe: [die
    Blueprint-Referenz](https://danrspencer.github.io/flare/reference/blueprint/).
  stamp: die Integration meldet eine Reparatur, sobald ein neuerer verfügbar ist.

schedule:
  source: 4ea6d160
  name: Zeitplan
  description: >-
    Der FLARE-Zeitplan, dem der Raum folgt: die Helligkeit und Farbtemperatur,
    die er anwendet.
    [Details](https://danrspencer.github.io/flare/reference/blueprint/#room).

room_target:
  source: 473fa05e
  name: Lampen & Anwesenheit
  description: >-
    Entität, Gerät, Bereich, Etage oder Label – die Lampen darin werden
    gesteuert, die Anwesenheits- und Bewegungssensoren darin entscheiden,
    wann. Mit „Ziel ausnehmen“ lässt du Sensoren weg, die du nicht willst.
    [Details](https://danrspencer.github.io/flare/reference/blueprint/#room).

customise_divider:
  source: ce9aec7e
  name: Anpassen
  description: >-
    Welche Lampen aus bleiben, Ruhehelligkeit und Szenen, je Phase. Nutze
    „Eigene“, wenn du mehr Kontrolle brauchst, als die Phasen erlauben.

morning_phase:
  source: 94c5e0a4
  name: Morgen

morning_exclude_lights:
  source: 5c964efa
  name: Lampen aus
  description: Lampen im Raum, die am Morgen aus bleiben.

morning_idle_brightness:
  source: 51c953ac
  name: Ruhehelligkeit
  description: >-
    Die Helligkeit (0–255), auf die der Raum dimmt, wenn er leer ist, statt
    auszuschalten. Praktisch als Nachtlicht. Funktioniert nur in Räumen mit
    Anwesenheits- oder Bewegungssensoren.
    [Details](https://danrspencer.github.io/flare/reference/blueprint/#idle-brightness).

morning_scene:
  source: 657d0fb8
  name: Szene
  description: >-
    Diese Szene wird während der Phase angewendet. Lampen, die nicht darin
    sind, folgen weiter dem Zeitplan.
    [Details](https://danrspencer.github.io/flare/reference/blueprint/#scenes).

