[tools]
python = "3.14"
uv = "0.11"

[env]
_.python.venv = { path = ".venv", create = true }
# The sandbox's port (scripts/sandbox.py). .claude/launch.json's "sandbox"
# entry repeats it. It runs hacs.json's minimum Home Assistant unless
# SANDBOX_HA_VERSION is set: SANDBOX_HA_VERSION=2026.11.0 mise run sandbox.
SANDBOX_PORT = "8124"

[tasks.install]
description = "Install test dependencies"
run = "pip install pytest pytest-homeassistant-custom-component"

[tasks.test]
description = "Run the full pytest suite"
run = "pytest"

[tasks."test:unit"]
description = "Run the unit tests and repo checks (no Home Assistant instance)"
run = "pytest tests/unit tests/checks"

[tasks."test:functional"]
description = "Run the functional tests (real Home Assistant)"
run = "pytest tests/functional"

[tasks."test:behaviour"]
description = "Run the behaviour suite (captures blueprint automation traces into trace-dumps/)"
run = "pytest tests/functional/behaviour -v"

[tasks.traces]
description = "Render captured blueprint automation traces from trace-dumps/ (run test:behaviour first)"
run = "python scripts/trace_summary.py trace-dumps"

[tasks."trace-viewer"]
description = "Interactive trace viewer: hover a step to jump to its line in the blueprint YAML"
run = "python scripts/trace_viewer.py"

[tasks."trace-export"]
description = "Export the trace viewer as static files (what docs.yml publishes at docs/trace-report/ on main)"
run = "python scripts/trace_viewer.py --export docs/trace-report"

[tasks."sandbox:install"]
description = "Install the sandbox's Home Assistant into .venv-sandbox/"
run = """
version="${SANDBOX_HA_VERSION:-$(python -c 'import json; print(json.load(open("hacs.json"))["homeassistant"])')}"
if [ "$(cat .venv-sandbox/installed 2>/dev/null)" = "$version" ] \
  && [ ! scripts/sandbox_requirements.py -nt .venv-sandbox/installed ]; then
  exit 0
fi
echo "Installing Home Assistant $version into .venv-sandbox/"
uv venv --clear -q -p "$(mise which python)" .venv-sandbox
uv pip install -q -p .venv-sandbox "homeassistant==$version"
uv pip install -q -p .venv-sandbox $(.venv-sandbox/bin/python scripts/sandbox_requirements.py)
echo "$version" > .venv-sandbox/installed
"""

[tasks.sandbox]
description = "Run a throwaway Home Assistant with FLARE and a fake house"
depends = ["sandbox:install"]
run = "python scripts/sandbox.py"

[tasks."sandbox:reset"]
description = "Run the sandbox from a brand-new house, throwing away its state"
depends = ["sandbox:install"]
run = "python scripts/sandbox.py --reset"
