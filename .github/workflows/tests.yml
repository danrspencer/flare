name: tests

# Deliberately not on `push`: for a branch with a pull request that ran
# the suite twice per push. Pull requests are tested here; a push to main
# is tested by cut-beta.yml, which calls this workflow on the commit it
# is about to release. A push to a branch with no pull request (a direct
# commit to dev, say) is not tested until it reaches main, where a failing
# suite stops the beta being cut.
on:
  pull_request:
  workflow_call:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches pyproject.toml's requires-python floor - tracks
          # whatever Python pytest-homeassistant-custom-component's
          # pinned Home Assistant release itself needs, not a separate,
          # broader compatibility target (this repo only ever runs
          # inside a real HA install, so there's nothing else to target).
          python-version: "3.14"
      # Not `pip install -e ".[dev]"` - this repo's flat layout
      # (custom_components/, blueprints/, dashboard/, brand/ all at
      # root) isn't set up for setuptools package discovery, and it
      # never needs to be: nothing here is ever distributed as an
      # installable Python package (HACS copies custom_components/
      # directly; the blueprint is imported by URL). pyproject.toml's
      # dev extra is a versions reference, not something installed
      # as-is.
      - run: pip install pytest pytest-homeassistant-custom-component
      - run: pytest -v --junitxml=junit.xml

      # Renders on the run page itself, so "what ran" doesn't mean
      # expanding the pytest step and scrolling 500+ verbose lines.
      # if: always() because the report matters MOST when pytest failed -
      # without it, the one run you actually want explained is the one
      # that never produces a summary.
      - name: Test report
        if: always()
        run: python scripts/test_summary.py junit.xml >> "$GITHUB_STEP_SUMMARY"

      # The behaviour tests capture the blueprint's real HA automation
      # trace (tests/behaviour/conftest.py). Rendering it here is the
      # closest thing to reading a trace in Home Assistant's own UI,
      # which cannot be done with these: HA's websocket API is read-only
      # and it never reads its trace store back at startup, so a trace
      # from CI can't be loaded into a live instance.
      - name: Blueprint traces
        if: always()
        run: python scripts/trace_summary.py trace-dumps >> "$GITHUB_STEP_SUMMARY"

      - name: Upload junit.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: junit.xml

      # Bundled with the raw traces rather than uploaded as its own
      # artifact: trace_viewer.py resolves the blueprint YAML and
      # trace-dumps/ relative to its own file location
      # (Path(__file__).resolve().parent.parent), so shipping all three
      # under one directory structure is what lets `python
      # scripts/trace_viewer.py` work immediately after unzipping,
      # with no path surgery. GitHub Actions has no "open this HTML"
      # button for an artifact - this only gets you as far as a local
      # `python scripts/trace_viewer.py` after downloading and
      # unzipping, not a link that renders in the browser.
      - name: Upload blueprint traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-traces
          path: |
            trace-dumps/
            scripts/trace_viewer.py
            scripts/trace_viewer.html
            blueprints/automation/danspencer/flare.yaml
          if-no-files-found: ignore
