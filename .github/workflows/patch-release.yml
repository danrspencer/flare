name: patch-release

# Pushing to a release branch patches the current release, straight to
# stable with no beta, leaving whatever is in beta on main behind - as a
# push to main cuts a beta:
#
#     git switch -c release/1.2.x <v1.2.0's Source: commit>
#     git cherry-pick -x <the fix>   # and a '## [1.2.1]' changelog section
#     git push origin release/1.2.x
#
# scripts/release.py only builds vX.Y.(Z+1) for the current release
# vX.Y.Z, and only from a commit built on that release's source whose
# changelog names the patch, so main's unreleased changes can't go out
# with it. A push that changes nothing shipped (the branch's first, say)
# releases nothing. The fix still needs to land on main for the next
# version.
#
# Each branch runs its own copy of this workflow and the script, from the
# release it was cut from.
on:
  push:
    branches: ["release/**"]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  patch:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build the release
        id: cut
        run: python scripts/release.py patch --source "$GITHUB_SHA"

      # See cut-beta.yml for why the tag push does not need release.yml.
      - name: Publish it
        if: steps.cut.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.cut.outputs.tag }}
          PREVIOUS: ${{ steps.cut.outputs.previous }}
        run: |
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes ${PREVIOUS:+--notes-start-tag "$PREVIOUS"}

  # The patch is the newest release, so its docs become the site's default.
  docs:
    needs: patch
    if: needs.patch.outputs.tag != ''
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      tag: ${{ needs.patch.outputs.tag }}
