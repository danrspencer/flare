name: release

# Cutting a release is pushing a tag. The workflow's job is to make sure
# the tag and the manifest can't disagree: HACS reads the version out of
# manifest.json, not out of the tag, so a mismatch means the version
# people see installed isn't the version they downloaded.
#
# TWO CHANNELS, decided by the tag alone:
#
#   v0.16.0          -> a normal release
#   v0.16.0-beta.1   -> a GitHub PRE-release
#
# HACS filters on GitHub's own prerelease flag, not on the tag text
# (custom_components/hacs/repositories/base.py: `if release.draft or
# (release.prerelease and not prerelease): continue`), and that filter is
# driven by the per-repository "Show beta versions" toggle. So a
# pre-release is invisible to anyone who hasn't opted in, and is offered
# as an ordinary update to anyone who has - which is the whole mechanism.
# Nothing here needs a second branch or a second repository.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag and manifest.json must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python -c "import json; print(json.load(open('custom_components/flare/manifest.json'))['version'])")
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag is v$tag but manifest.json says $manifest - bump the manifest and re-tag"
            exit 1
          fi

      # A hyphen is the whole rule, which is why it isn't shared with
      # tests/test_version.py as code - that file asserts this workflow
      # still wires the result up, which is the part that could silently
      # break.
      - name: Which channel is this
        id: channel
        run: |
          tag="${GITHUB_REF_NAME#v}"
          case "$tag" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT"; echo "base=${tag%%-*}" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT"; echo "base=$tag"       >> "$GITHUB_OUTPUT" ;;
          esac

      # The blueprint's stamp names the tag the repair's Fix button
      # downloads from, so it has to be a tag that exists AND one that
      # suits this release's audience. Two separate ways to get that
      # wrong, both silent until a user presses Fix:
      #
      #   - a stable release carrying a beta stamp would hand every
      #     stable user a beta blueprint, quietly undoing the whole
      #     point of having two channels
      #   - a stamp naming a tag that was never cut (a typo, or a bump
      #     that got ahead of its release) makes Fix fail with a
      #     download error and no way for the user to fix it themselves
      - name: The blueprint stamp must suit this release
        env:
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          stamp=$(python -c "import sys; sys.path.insert(0, 'custom_components/flare'); import blueprint_version; print(blueprint_version.BLUEPRINT_VERSION)")
          tag="${GITHUB_REF_NAME#v}"
          echo "release $tag (prerelease=$PRERELEASE), blueprint stamped $stamp"

          case "$stamp" in
            *-*) stamp_is_beta=true ;;
            *)   stamp_is_beta=false ;;
          esac

          if [ "$PRERELEASE" = "false" ] && [ "$stamp_is_beta" = "true" ]; then
            echo "::error::this is a stable release but the blueprint is stamped $stamp, a prerelease. Set BLUEPRINT_VERSION and the blueprint's description to $tag before promoting, or every stable user is pointed at a beta blueprint."
            exit 1
          fi

          # Either the blueprint changed in THIS release (the tag is
          # being created right now, so it cannot be looked up yet), or
          # it changed in an earlier one and that tag must already exist.
          if [ "$stamp" = "$tag" ]; then
            echo "blueprint changed in this release"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$stamp" >/dev/null 2>&1; then
            echo "blueprint unchanged since v$stamp, which exists"
            exit 0
          fi
          echo "::error::the blueprint is stamped $stamp but there is no v$stamp tag, so the repair's Fix button would download from a URL that does not exist. Either bump the stamp to $tag, or correct it to a released version."
          exit 1

      # The BASE version, so a run of betas can share the one section
      # that describes what they are building toward. Requiring a section
      # per beta would make the changelog a build log, and would put a
      # commit in the way of every throwaway test build.
      - name: The changelog must describe this version
        env:
          BASE: ${{ steps.channel.outputs.base }}
        run: |
          if ! grep -q "^## \[$BASE\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$BASE]' section"
            exit 1
          fi

      # gh is preinstalled on the runner, so this needs no third-party
      # action to review or keep up to date.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          # Not `[ "$PRERELEASE" = true ] && flags=...` - that is the last
          # command in the step when the test is false, so the step would
          # exit non-zero under bash -e and fail every stable release.
          if [ "$PRERELEASE" = "true" ]; then
            flags="--prerelease"
          else
            flags=""
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes $flags
