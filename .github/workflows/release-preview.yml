name: release-preview

# Comments on a pull request with the beta it would ship in if merged now,
# or the patch for one into a release branch, and the release notes it
# would get. One comment, updated in place
# on every push or retitle.
#
# A pull request from a fork gets a read-only token, so it gets no comment.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  # generate-notes needs contents: write. Safe only because the job skips
  # forks, so this never runs a stranger's code with a write token.
  contents: write
  pull-requests: write

concurrency:
  group: release-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The script reads every tag and diffs against earlier releases.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Before the notes are read, since a `repo` label leaves a pull
      # request out of them (release.yml). Reads the checked-out
      # labeler.yml. A fork's pull request is labelled by labeler.yml.
      - name: Label
        id: label
        uses: actions/labeler@v5
        with:
          sync-labels: true

      # HEAD is the pull request merged into its base: what the base would be.
      - name: Which release it would ship in
        id: preview
        env:
          BASE: ${{ github.base_ref }}
        run: |
          case "$BASE" in
            release/*) python scripts/release.py preview --source HEAD --patch ;;
            *) python scripts/release.py preview --source HEAD ;;
          esac

      - name: Comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          URL: ${{ github.event.pull_request.html_url }}
          TAG: ${{ steps.preview.outputs.tag }}
          PREVIOUS: ${{ steps.preview.outputs.previous }}
          REASON: ${{ steps.preview.outputs.reason }}
          LABELS: ${{ steps.label.outputs.all-labels }}
        run: |
          marker='<!-- release-preview -->'
          {
            echo "$marker"
            echo "### Release preview"
            echo
            if [ -n "$TAG" ]; then
              # GitHub lists only merged pull requests, so this one is added,
              # unless its label leaves it out.
              line="* $TITLE by @$AUTHOR in $URL"
              case ",$LABELS," in *,repo,*) line="" ;; esac
              notes=$(gh api "repos/$REPO/releases/generate-notes" \
                -f tag_name="$TAG" -f target_commitish="$BASE" \
                ${PREVIOUS:+-f previous_tag_name="$PREVIOUS"} -q .body)
              case "$BASE" in
                # A patch merged first takes this number; this one then needs a new section.
                release/*) echo "Merged now, this ships as **$TAG**, straight to stable." ;;
                *) echo "Merged now, this ships in **$TAG**. A pull request merged first would take that number, and this one would ship in the next." ;;
              esac
              echo
              echo "<details><summary>Release notes for $TAG</summary>"
              echo
              NOTES="$notes" LINE="$line" python3 -c '
          import os
          notes, line = os.environ["NOTES"], os.environ["LINE"]
          heading = "## What\x27s Changed\n"
          if not line:
              print(notes)
          elif heading in notes:
              head, rest = notes.split(heading, 1)
              items, sep, tail = rest.partition("\n\n")
              print(head + heading + items + "\n" + line + sep + tail)
          else:
              print(heading + line + "\n\n" + notes)
          '
              echo
              echo "</details>"
            else
              case "$BASE" in
                release/*) echo "Merged now, this ships in no release: $REASON" ;;
                *) echo "Merged now, this ships in no beta: $REASON" ;;
              esac
            fi
            case ",$LABELS," in *,repo,*)
              echo
              echo "Labelled \`repo\`, so it's left out of every release's notes." ;;
            esac
          } > body.md

          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            -q ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md > /dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file body.md
          fi
