name: cut-beta

# Pushing to main cuts a beta. That is the whole interface: the branch is
# the beta line, so getting a change into a tester's hands is
#
#     git push origin dev:main
#
# which must be a fast-forward - main requires linear history, and a
# squash or rebase merge from a pull request would give main new SHAs
# that dev never sees.
#
# Nothing is committed anywhere. scripts/release.py builds the release on
# the side (a commit carrying the real version numbers, reachable from no
# branch), and this workflow only pushes the tag it made. See that
# script's docstring for why the source carries a placeholder instead.
#
# Tests run first, on the exact commit being released. tests.yml
# deliberately does not run on pushes to main itself, so this call is the
# only run for it rather than a duplicate.
on:
  push:
    branches: [main]

# Two pushes in quick succession must not race for the same beta number.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  beta:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.release_docs.outputs.follows_head == 'true' && steps.release_docs.outputs.tag || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The script reads every tag and diffs against earlier releases.
          fetch-depth: 0

      - name: Build the beta
        id: cut
        run: python scripts/release.py cut-beta --source "$GITHUB_SHA"

      # Whether the newest release's docs follow this push: they do while
      # nothing shipped has changed since that release's source.
      - name: Does the release's documentation follow main
        id: release_docs
        run: python scripts/release.py docs-source --head "$GITHUB_SHA"

      # A tag pushed with GITHUB_TOKEN does not trigger release.yml (GitHub
      # does not let a workflow's own events start other workflows), which
      # is what we want: its checks exist to police a tag typed by hand,
      # and a tag the script built agrees with its own manifest by
      # construction.
      - name: Publish it
        if: steps.cut.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.cut.outputs.tag }}
          # Named explicitly: release commits are on no branch, so GitHub
          # would find no earlier tag to count from (release.py notes_start).
          PREVIOUS: ${{ steps.cut.outputs.previous }}
        run: |
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes --prerelease ${PREVIOUS:+--notes-start-tag "$PREVIOUS"}

  # The beta's docs. Also when nothing shipped changed and no beta was
  # cut: a docs-only push still updates them, under the newest beta's
  # number.
  docs:
    needs: beta
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml

  # The newest release's docs, when this push changed nothing shipped since
  # it: a docs fix made after the last beta reaches the site's default.
  release-docs:
    needs: [beta, docs]
    if: needs.beta.outputs.release != ''
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      tag: ${{ needs.beta.outputs.release }}
