name: Something isn't working
description: Lights doing something odd, setup or install trouble, the dashboard not loading
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying FLARE! Only the first box is needed. Anything else you can add usually means I can help quicker.

  - type: textarea
    id: what-happened
    attributes:
      label: What's happening?
      description: What you expected, what you saw instead, and roughly when. Screenshots are very welcome.
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: FLARE's version (HACS → FLARE) and Home Assistant's (Settings → About).
      placeholder: FLARE 2.0.0, Home Assistant 2026.10.4
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: What's it about?
      options:
        - Lights turning on or off when they shouldn't (or not when they should)
        - Lights showing as overridden
        - Brightness or colour not what I expected
        - Installing or updating
        - Setting up
        - The dashboard
        - Something else
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ### Extras that help

        - **Room doing the wrong thing:** a trace of that run (the automation's **⋮ → Traces → ⋮ → Download trace**)
        - **Lights showing as overridden:** diagnostics from **FLARE → Settings → ⋮ → Download diagnostics**, soon after it happens
        - **Dashboard:** red errors from the browser console. A hard reload (Ctrl/Cmd+Shift+R) often fixes it after an update
        - **Installing:** your HACS version, and any `hacs` or `flare` lines in **Settings → System → Logs**

  - type: textarea
    id: lights
    attributes:
      label: Your lights and sensors
      description: Brand and model, and how they're connected (Hue, ZHA, Zigbee2MQTT, Matter, etc.), for whichever ones are misbehaving. Same for any occupancy or motion sensors if they're involved. If you've attached the diagnostics, they already cover the lights that were overridden.
      placeholder: e.g. IKEA TRADFRI bulbs through Zigbee2MQTT, Aqara FP2 presence sensor
    validations:
      required: false

  - type: textarea
    id: extras
    attributes:
      label: Traces, diagnostics, logs
      description: Drop any of the files above in here, or paste text. Anything you'd rather keep private, just leave out.
    validations:
      required: false
