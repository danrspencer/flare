name: Idea or request
description: Something you'd like FLARE to do, or do differently
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: What you're trying to do in your home, and what gets in the way today. The situation helps more than a specific fix, since there's sometimes a way to do it already.
    validations:
      required: true
